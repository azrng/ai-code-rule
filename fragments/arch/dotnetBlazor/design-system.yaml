# 设计与组件规则的唯一事实来源。
# 颜色、主题、字体、风格关键词当前为内置基线值：首次界面任务前按产品品牌定制，完成后把 meta.status 改为「已定制」
# status 为「已定制」后 use-ai-rule 重新生成不再覆盖本文件；结构契约与定制流程见界面子规则的设计系统小节
# 该文件面向人和 AI 共同使用：可读、可解析、非可执行、易于比对。
# 技术栈：.NET（版本以仓库 TargetFramework 为准）+ Blazor Server + 组件库（BootstrapBlazor / MudBlazor 二选一，以项目实际引用为准）

meta:
  name: "企业级应用设计系统（Blazor Server + BootstrapBlazor / MudBlazor）"
  version: "1.1.0"
  status: "基线待定制"
  owners:
    - "design"
    - "frontend"
  tech_stack:
    ui_framework: "BootstrapBlazor（基于 Bootstrap 5）或 MudBlazor（Material Design），全项目唯一组件库，不得混用"
    styling: "随组件库：Bootstrap 5 CSS 变量或 MudBlazor CSS 变量（--mud-*），统一在 wwwroot/css 主题文件覆盖，禁止硬编码视觉值"
    icons: "随组件库：Bootstrap Icons 或 MudBlazor 内置 Material Icons，尺寸 16-24px"
    charts: "BootstrapBlazor.Chart 扩展包（Chart.js）或 ECharts（通过 JSInterop），按项目现有依赖选用"
    state_management: "Blazor Scoped 服务（跨页面 / 用户会话状态）+ Singleton（跨用户全局配置）+ @bind/@code（组件本地状态）"
  default_ports:
    blazor_app: 8080 # Blazor Server / 容器内端口
    database: 5432 # PostgreSQL / 容器内端口
  port_conflict_policy: "宿主机端口冲突时，优先调整 docker-compose.yml 中的宿主机映射端口，容器内端口保持不变，并同步更新 .env.example 和配置"
  usage:
    read_order:
      - "在进行任何 UI 改动前阅读本文件"
      - "然后查看 wwwroot/css/theme.css 主题覆盖"
      - "然后再查看现有页面与组件实现"
    principles:
      - "优先复用，而不是重新发明"
      - "优先使用所选组件库（BootstrapBlazor / MudBlazor 之一）的现成组件，而不是自定义实现"
      - "优先使用所选组件库的 CSS 变量（Bootstrap --bs-* 或 MudBlazor --mud-*），而不是硬编码视觉值"
      - "优先使用已有项目组件，而不是先写自定义组件"

product:
  style_keywords:
    - "专业"
    - "清晰"
    - "可信"
    - "高效"
    - "现代"
  ui_goal:
    - "企业后台界面优先保证清晰度与信息密度平衡"
    - "状态和反馈必须让用户一眼看懂"
    - "数据可视化图表风格统一、专业"
    - "Blazor Server 交互流畅，减少不必要的页面刷新"

# ============================================================
# 颜色 Token
# 基于 Bootstrap 5 CSS 变量体系
# 使用方式：var(--bs-primary) 或 Bootstrap 工具类 text-primary
# ============================================================
tokens:
  colors:
    # 主品牌色 - 企业蓝
    primary:
      50: "#EEF4FF"
      100: "#E0EBFF"
      200: "#B3D9FF"
      300: "#80C1FF"
      400: "#4DA8FF"
      500: "#0d6efd" # 主色，与 Bootstrap 默认 primary 对齐
      600: "#0a58ca"
      700: "#084298"
      800: "#052c65"
      900: "#031633"

    # 成功色
    success:
      50: "#F0FDF4"
      100: "#E6FBEE"
      200: "#BFFCE0"
      300: "#8FF7D0"
      400: "#5AE9BA"
      500: "#198754" # 与 Bootstrap success 对齐
      600: "#146c43"
      700: "#0f5132"
      800: "#0a3622"
      900: "#051b11"

    # 警告色
    warning:
      50: "#FEF3C7"
      100: "#FEE8B6"
      200: "#FDD48F"
      300: "#FBC15E"
      400: "#F9A825"
      500: "#ffc107" # 与 Bootstrap warning 对齐
      600: "#d9a406"
      700: "#b37d05"
      800: "#8c5e04"
      900: "#664003"

    # 错误/危险色
    danger:
      50: "#FEF2F2"
      100: "#FEE2E2"
      200: "#FECACA"
      300: "#FCA5A5"
      400: "#F87171"
      500: "#dc3545" # 与 Bootstrap danger 对齐
      600: "#bb2d3b"
      700: "#9a252f"
      800: "#791d25"
      900: "#58151c"

    # 信息色
    info:
      50: "#EFF6FF"
      100: "#DBEAFE"
      200: "#B8D4FE"
      500: "#0dcaf0" # 与 Bootstrap info 对齐
      600: "#0aa2c0"
      700: "#087a90"
      800: "#065260"
      900: "#042a30"

    # 中性色 - 灰度系
    gray:
      50: "#F8F9FA" # Bootstrap gray-100
      100: "#F3F4F6"
      150: "#EBEEF2"
      200: "#E9ECEF" # Bootstrap gray-200
      300: "#DEE2E6" # Bootstrap gray-300
      400: "#ADB5BD" # Bootstrap gray-400
      500: "#6C757D" # Bootstrap gray-500
      600: "#495057" # Bootstrap gray-600
      700: "#343A40" # Bootstrap gray-700
      800: "#212529" # Bootstrap gray-800
      900: "#111827"

  # ============================================================
  # 语义化颜色映射
  # ============================================================
  semantic:
    text:
      primary: "text-body" # Bootstrap 主文本
      secondary: "text-muted" # 次要文本
      disabled: "text-black-50" # 禁用文本
      inverse: "text-white" # 反色文本
      link: "text-primary" # 链接
      link_hover: "text-primary" # .text-decoration-underline
    background:
      page: "bg-light" # 页面背景
      container: "bg-white" # 卡片/面板背景
      subtle: "bg-body-secondary" # 次级区块背景
      active: "bg-primary-subtle" # 激活/选中背景
    border:
      default: "border" # 默认边框
      strong: "border-secondary" # 强调边框
      focus: "border-primary" # 焦点边框
    status:
      success_bg: "bg-success-subtle"
      success_text: "text-success"
      warning_bg: "bg-warning-subtle"
      warning_text: "text-warning"
      danger_bg: "bg-danger-subtle"
      danger_text: "text-danger"
      info_bg: "bg-info-subtle"
      info_text: "text-info"

  typography:
    font_family:
      sans: "'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif"
      mono: "SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace"
    font_size:
      xs: "0.75rem" # 12px - fs-6 或自定义
      sm: "0.875rem" # 14px - Bootstrap 默认小号
      base: "1rem" # 16px - Bootstrap 根字号
      md: "0.9375rem" # 15px
      lg: "1.125rem" # 18px - fs-5
      xl: "1.25rem" # 20px - fs-4
      2xl: "1.5rem" # 24px - fs-3
      3xl: "1.875rem" # 30px - fs-2
      4xl: "2.25rem" # 36px - fs-1
    font_weight:
      light: 300 # fw-light
      normal: 400 # fw-normal
      medium: 500 # fw-medium
      semibold: 600 # fw-semibold
      bold: 700 # fw-bold
    line_height:
      tight: 1.2 # lh-1
      normal: 1.5 # lh-base（默认）
      relaxed: 1.75

  spacing:
    base_unit: "0.25rem" # Bootstrap spacing 基础单位（4px 的近似）
    # 使用 Bootstrap 间距工具类，禁止硬编码数值
    scale:
      0: "0"
      1: "0.25rem" # 4px - p-1, m-1
      2: "0.5rem" # 8px - p-2, m-2
      3: "1rem" # 16px - p-3, m-3
      4: "1.5rem" # 24px - p-4, m-4
      5: "3rem" # 48px - p-5, m-5

  radius:
    none: "0"
    sm: "0.2rem" # rounded-1
    md: "0.375rem" # rounded（默认）
    lg: "0.5rem" # rounded-3
    xl: "0.75rem" # rounded-4
    2xl: "1rem" # rounded-5
    full: "50rem" # rounded-pill

  shadow:
    none: "none" # shadow-none
    sm: "0 0.125rem 0.25rem rgba(0, 0, 0, 0.075)" # shadow-sm
    md: "0 0.5rem 1rem rgba(0, 0, 0, 0.15)" # shadow（默认）
    lg: "0 1rem 3rem rgba(0, 0, 0, 0.175)" # shadow-lg

  transitions:
    fast: "100ms"
    base: "200ms"
    slow: "300ms"
    slower: "500ms"

  breakpoints:
    sm: "576px" # Bootstrap sm
    md: "768px" # Bootstrap md
    lg: "992px" # Bootstrap lg
    xl: "1200px" # Bootstrap xl
    xxl: "1400px" # Bootstrap xxl

# ============================================================
# BootstrapBlazor 主题配置映射
# 自定义主题覆盖在 wwwroot/css/theme.css 中实现
# ============================================================
# 以下为主题覆盖基线（BootstrapBlazor 语义）；项目选 MudBlazor 时按 mudblazor skill 覆盖 --mud-palette-* 变量，语义对应
bootstrap_blazor:
  theme_overrides:
    location: "wwwroot/css/theme.css"
    description: "通过覆盖 Bootstrap CSS 变量自定义主题颜色"
    css_variables:
      primary: "--bs-primary"
      success: "--bs-success"
      warning: "--bs-warning"
      danger: "--bs-danger"
      info: "--bs-info"
  usage_rules:
    - "优先使用 BootstrapBlazor 组件，不重复造轮子"
    - "优先使用 Bootstrap CSS 工具类：text-primary、bg-light、p-3、mb-4"
    - "禁止使用 style=\"\" 属性硬编码样式"
    - "间距统一用 Bootstrap 工具类：p-3、m-2、gap-3、px-4 等"
    - "响应式遵循 Bootstrap 断点：col-12 col-md-6 col-lg-4"
    - "组件具体参数与用法不在本文件展开，按 component_specs 的 API 来源约定执行"

# ============================================================
# 状态管理规范
# ============================================================
state_management:
  local_state:
    tool: "Blazor @code 块 + @bind 双向绑定"
    use_for:
      - "表单输入值"
      - "弹窗开关"
      - "单个组件的 loading/error 状态"
      - "本地筛选、排序、分页"
  global_state:
    tool: "Blazor Scoped 服务（跨页面共享、每用户独立；Blazor Server 中随 Circuit 存活）"
    store_location: "Services/"
    use_for:
      - "当前登录用户信息"
      - "权限与角色"
      - "侧边菜单折叠状态"
      - "全局通知/消息"
      - "跨页面共享的筛选条件"
      - "主题/语言配置"
    naming: "XxxService（如 UserService、PermissionService）"
    injection: "@inject IUserService UserService"

# ============================================================
# 页面状态规范
# ============================================================
page_states:
  required:
    - "loading"
    - "empty"
    - "error"
    - "no-permission"
  guidance:
    loading:
      description: "数据加载中"
      implementation: "使用 BootstrapBlazor 的 Spinner 组件或 Skeleton 骨架屏"
      bootstrap_example: "<Spinner /> 或 <Skeleton />"
    empty:
      description: "无数据"
      implementation: "展示空状态图示 + 简短说明 + 引导操作按钮"
      bootstrap_blazor_component: "<Empty /> 组件"
    error:
      description: "请求失败"
      implementation: "展示可读的错误原因，提供重试按钮"
      bootstrap_blazor_component: "<Alert Color=\"Color.Danger\" />"
    no_permission:
      description: "权限不足"
      implementation: "使用 <AuthorizeView> 组件控制可见性"
      bootstrap_blazor_component: "<AuthorizeView>"

# ============================================================
# 组件使用规则
# ============================================================
component_rules:
  reuse_first: true
  naming:
    components: "PascalCase（Razor 组件文件名与类名一致）"
    services: "PascalCase，以 Service 结尾"
    utils: "PascalCase"
  custom_component_policy:
    - "只有在确实存在复用价值时才新增共享组件"
    - "避免为了单次需求做过度抽象"
    - "组件职责保持单一"
  categories:
    layout:
      description: "布局组件"
      location: "Components/Layout/"
      examples:
        - "MainLayout.razor（主布局）"
        - "NavMenu.razor（导航菜单）"
        - "LoginLayout.razor（登录布局）"
    ui:
      description: "基础 UI 组件（优先使用 BootstrapBlazor 内置组件）"
      location: "Components/Common/"
      examples:
        - "Button, Table, Modal, Drawer, Dialog"
        - "Select / MultiSelect, DateTimePicker, ValidateForm / EditorForm"
        - "Toast / Swal / Message, Layout / Menu / Tab"
        - "Spinner, Skeleton, Empty, TreeView"

# ============================================================
# 表单规范
# ============================================================
form_rules:
  layout:
    label_position: "标签在输入框上方（默认）或左侧（水平表单）"
    required_mark: "标签后紧跟红色星号 *"
    helper_text: "输入框下方帮助文字，text-muted fs-6"
    error_text: "输入框下方，text-danger fs-6"
    field_gap: "Bootstrap 间距 mb-3"
  sizes:
    sm:
      description: "紧凑型，用于筛选栏、内联表单"
      form_control: "form-control form-control-sm"
      button: "btn btn-sm"
    md:
      description: "默认尺寸，企业表单标准"
      form_control: "form-control"
      button: "btn"
    lg:
      description: "宽松型，用于登录、注册等关键表单"
      form_control: "form-control form-control-lg"
      button: "btn btn-lg"
  validation:
    bootstrap_blazor: "使用 BootstrapBlazor 的 ValidateForm / EditorForm（参数与用法见 skill 或官方文档）"

# ============================================================
# 组件使用规范
# 只管选型口径与红线；具体组件参数、服务用法以 bootstrap-blazor skill
# （如环境提供）或项目锁定版本的官方文档为准
# ============================================================
component_specs:
  api_source:
    - "环境提供 bootstrap-blazor / mudblazor skill 时，组件选型、参数与服务用法优先以项目所选库对应的技能为准（含反臆造清单）"
    - "无 skill 时以项目锁定版本的所选组件库官方文档为准；禁止从其它组件库（含未选用的另一个 Blazor 组件库）借参数或样式类"
  prerequisites: "随所选库：BootstrapBlazor 需 AddBootstrapBlazor() 注册、交互页面内放置 <BootstrapBlazorRoot>（弹窗 portal 依赖）并按官方要求引入 bundle CSS/JS；MudBlazor 需 AddMudServices()、引入 mudblazor.css/js 并放置 <MudThemeProvider>/<MudPopoverProvider>/<MudDialogProvider>/<MudSnackbarProvider>——缺一项相关页面会静默失效"
  selection:
    note: "以下以 BootstrapBlazor 语义书写；项目选 MudBlazor 时按 mudblazor skill 或官方文档换用对应组件（如 MudTextField / MudDatePicker / MudSelect / MudTable / MudDialog / MudSnackbar），交互意图与状态要求不变"
    input: "文本 / 数字用 <BootstrapInput> / <BootstrapInputNumber>，多行用 <Textarea>，密码用 <BootstrapPassword>"
    date: "日期时间用 <DateTimePicker>（ViewMode 切换 Date/DateTime/Month/Year），范围用 <DateTimeRange>"
    select: "单选用 <Select>（可 ShowSearch），多选用 <MultiSelect>"
    upload: "按场景选 ButtonUpload / InputUpload / CardUpload / AvatarUpload / DropUpload"
    table: "<Table> 服务端查询（OnQueryAsync + IsPagination）；列排序 / 筛选在 <TableColumn> 上设 Sortable / Filterable；明细行 IsDetails 配合 DetailRowTemplate"
    feedback: "Dialog / Modal / Drawer / Toast / Swal 通过注入具体服务类调用，方法名是 Show"
    nav: "步骤条 <Step>（Items + StepIndex），面包屑 <Breadcrumb>（Value 传 BreadcrumbItem 集合），标签页 <Tab> + <TabItem>"
  rules:
    - "表格必须处理 loading、empty、error 三种状态，操作列固定在最右侧"
    - "表单弹窗提交按钮须有 loading 态防止重复提交；危险操作用 danger 色确认按钮"
    - "详情查看用 Drawer，需用户聚焦决策用 Modal"
    - "表格 / 列表数据加载优先 Skeleton，不用全页 Spinner 遮罩"
    - "多级菜单最多 2 层，折叠状态下菜单名称通过 Tooltip 展示"

icons:
  library: "随组件库：Bootstrap Icons（BootstrapBlazor）或 MudBlazor 内置 Material Icons"
  usage_rules:
    - "统一使用所选图标库类名：Bootstrap Icons 用 bi bi-house 等，MudBlazor 用 @Icons.Material.Outlined.House 等（见 mudblazor skill）"
    - "BootstrapBlazor 组件内置图标使用 IconName 枚举"
    - "禁止混用两个图标库，禁止自定义 SVG 图标或使用其他图标库"
    - "禁止使用 <img src='icon.svg' /> 作为图标"

# ============================================================
# 响应式设计规范
# ============================================================
responsive:
  principle: "移动优先（Mobile First）- Bootstrap 5 断点体系"
  legacy_files: "存量样式文件已是桌面优先写法（max-width 查询 + 桌面基础样式）时，增量改动沿用该文件既有约定，不整体重写扩大 diff；新增文件遵循移动优先"
  breakpoints:
    xs: "< 576px（默认，手机竖屏）"
    sm: "576px - 手机横屏"
    md: "768px - 平板"
    lg: "992px - 桌面"
    xl: "1200px - 宽屏"
    xxl: "1400px - 超宽屏"
  common_patterns:
    grid_cols: "col-12 col-md-6 col-lg-4"
    padding: "p-3 p-md-4 p-lg-5"
    sidebar_width: "col-12 col-lg-3"

# ============================================================
# Do / Don't 规则
# ============================================================
do:
  - "优先复用现有组件和页面模式"
  - "优先使用 BootstrapBlazor 组件（Table、Form、Modal 等）"
  - "优先使用 Bootstrap CSS 工具类（text-primary、bg-light、p-3）"
  - "保持完整的页面状态反馈（loading/empty/error/no-permission）"
  - "跨页面状态使用 Scoped 服务，跨用户全局配置使用 Singleton，组件本地状态使用 @bind/@code"
  - "图标统一使用 Bootstrap Icons"
  - "响应式遵循 Bootstrap 断点体系"
  - "表单验证使用 BootstrapBlazor 的 ValidateForm"

dont:
  - "不要使用 style=\"\" 属性硬编码样式"
  - "不要硬编码颜色值（如 #0d6efd）"
  - "不要硬编码间距数值"
  - "不要在组件中直接实现复杂业务逻辑，应提取到服务层"
  - "不要交付缺少 loading、empty、error 状态的页面"
  - "不要再创建新的设计 token 文件或平行配置体系"
  - "不要使用 Bootstrap Icons 以外的图标库"
  - "不要在没有充分复用价值的情况下创建新共享组件"
  - "不要在 Blazor Server 中使用 jQuery 操作 DOM"
  - "不要嵌套超过 2 层弹窗（Modal/Drawer）"
  - "不要使用非 BootstrapBlazor 的第三方 Blazor 组件库"
  - "不要在 @code 块中编写同步阻塞代码"
