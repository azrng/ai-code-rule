# WinForms 桌面端设计系统唯一事实来源
# 颜色、主题、字体、风格关键词当前为内置基线值：首次界面任务前按产品品牌定制，完成后把 meta.status 改为「已定制」
# status 为「已定制」后 use-ai-rule 重新生成不再覆盖本文件；结构契约与定制流程见界面子规则的设计系统小节
# 面向人和 AI 共同使用：可读、可解析、非可执行、易于比对
# 技术栈：.NET（版本以仓库 TargetFramework 为准）+ Windows Forms + AntdUI + CommunityToolkit.Mvvm

meta:
  name: "WinForms 桌面端设计系统"
  version: "1.0.0"
  status: "基线待定制"
  platform: "Desktop"
  owners:
    - "design"
    - "desktop"
  tech_stack:
    runtime: ".NET（版本以仓库 TargetFramework 为准）"
    ui_framework: "Windows Forms (WinForms)"
    component_library: "AntdUI（Apache-2.0；企业 Ribbon/Docking 场景可选 Krypton.StandardToolkit）"
    mvvm: "CommunityToolkit.Mvvm"
    data_access: "Dapper + SQLite / PostgreSQL / 其他（按项目选择，可选）"
    messaging: "IMessenger"
    dependency_injection: "Microsoft.Extensions.DependencyInjection"
  usage:
    read_order:
      - "先阅读根 `AGENTS.md`，确认全局规则、任务阶段和交付要求"
      - "涉及界面时，再阅读 `ui-AGENTS.md` 中的 WinForms 视图层规则"
      - "然后阅读本文件，并查看现有 Views、ViewModels、Controls 与主题样式实现"
    principles:
      - "优先复用，而不是重新创建"
      - "优先使用语义化样式资源，而不是直接写视觉值"
      - "优先通过统一主题入口管理样式，而不是在控件属性中硬编码"
      - "优先保持桌面端交互清晰、稳定、易恢复"

product:
  style_keywords:
    - "专业"
    - "清晰"
    - "可信"
    - "高效"
    - "现代"
    - "克制"
  ui_goal:
    - "以桌面端高信息密度场景为前提，保证层级清晰和操作稳定"
    - "在复杂业务页面中优先保证可读性、状态感知和低学习成本"
    - "重要操作必须有明确反馈，危险操作必须有二次确认"
    - "主框架、列表页、表单页、详情页、对话框风格保持统一"
  motion_goal:
    - "动效用于强化导航和状态反馈，不做喧宾夺主的装饰"
    - "页面切换、对话框出现、加载占位采用轻量过渡（AntdUI 内置动画）"

design_principles:
  - "Ant Design 风格为主，保持简洁、克制、可依赖"
  - "统一使用浅色主题作为默认主题，深色主题经官方 SetColorMode 或组件库主题统一切换"
  - "主流程优先，次级信息弱化，危险操作显著区分"
  - "所有用户可见状态必须可解释：成功、失败、为空、加载中"

tokens:
  colors:
    brand:
      50: "#F4F8FF"
      100: "#E8F0FF"
      200: "#C9DDFF"
      300: "#A7C7FF"
      400: "#7AA7F8"
      500: "#4C84F0"
      600: "#3568D4"
      700: "#264FB0"
      800: "#1A387F"
      900: "#122554"
    neutral:
      0: "#FFFFFF"
      50: "#F8FAFC"
      100: "#F1F5F9"
      150: "#E9EEF5"
      200: "#DCE3EC"
      300: "#C2CDD9"
      400: "#94A3B8"
      500: "#64748B"
      600: "#475569"
      700: "#334155"
      800: "#1F2937"
      900: "#0F172A"
    success:
      50: "#F0FDF4"
      100: "#DCFCE7"
      500: "#22C55E"
      600: "#16A34A"
      700: "#15803D"
    warning:
      50: "#FFF7ED"
      100: "#FFEDD5"
      500: "#F59E0B"
      600: "#D97706"
      700: "#B45309"
    error:
      50: "#FEF2F2"
      100: "#FEE2E2"
      500: "#EF4444"
      600: "#DC2626"
      700: "#B91C1C"
    info:
      50: "#EFF6FF"
      100: "#DBEAFE"
      500: "#3B82F6"
      600: "#2563EB"
      700: "#1D4ED8"

  semantic:
    text:
      primary: "Style.TextColor.Primary"
      secondary: "Style.TextColor.Secondary"
      tertiary: "Style.TextColor.Tertiary"
      inverse: "Style.TextColor.Inverse"
      link: "Style.TextColor.Link"
      danger: "Style.TextColor.Danger"
    background:
      app: "Style.BackColor.App"
      surface: "Style.BackColor.Surface"
      subtle: "Style.BackColor.Subtle"
      elevated: "Style.BackColor.Elevated"
      overlay: "Style.BackColor.Mask"
      selected: "Style.BackColor.Selected"
      disabled: "Style.BackColor.Disabled"
    border:
      default: "Style.BorderColor.Default"
      strong: "Style.BorderColor.Strong"
      focus: "Style.BorderColor.Focus"
      danger: "Style.BorderColor.Danger"
    status:
      success_bg: "Style.BackSuccess"
      success_text: "Style.ForeColorSuccess"
      warning_bg: "Style.BackWarning"
      warning_text: "Style.ForeColorWarning"
      error_bg: "Style.BackError"
      error_text: "Style.ForeColorError"
      info_bg: "Style.BackInfo"
      info_text: "Style.ForeColorInfo"

  typography:
    font_family:
      default: "Microsoft YaHei UI, Segoe UI, sans-serif"
      monospace: "Cascadia Mono, Consolas, monospace"
    font_size:
      caption: 12
      body_small: 13
      body: 14
      body_large: 16
      title_small: 18
      title: 20
      title_large: 24
      hero: 30
    font_weight:
      regular: "Regular"
      medium: "Medium"
      semibold: "SemiBold"
      bold: "Bold"
    line_height:
      tight: 1.2
      normal: 1.5
      relaxed: 1.7

  spacing:
    base_unit: 4
    scale:
      xs: 4
      sm: 8
      md: 12
      lg: 16
      xl: 20
      "2xl": 24
      "3xl": 32
      "4xl": 40
      "5xl": 48

  radius:
    xs: 2
    sm: 4
    md: 6
    lg: 8
    xl: 12
    "2xl": 16
    pill: 999

  shadow:
    none: "none"
    sm: "0,1,3,0,#14000000"
    md: "0,4,12,0,#18000000"
    lg: "0,10,24,0,#22000000"

  motion:
    duration:
      fast: 120
      base: 180
      slow: 260
    easing:
      standard: "EaseOutCubic"
      entrance: "EaseOutQuart"
      exit: "EaseInCubic"

  breakpoints:
    compact_width: 960
    regular_width: 1280
    expanded_width: 1600
    compact_height: 720

resources:
  structure:
    theme_entry: "Themes/ThemeManager.cs（统一主题入口）"
    palette: "Themes/Palette.cs（token 到 Color / Font 的静态映射）"
    styles: "Themes/ControlStyles.cs（控件默认样式统一应用）"
  antdui_integration:
    style_classes: "AntdUI.Style.TextColor / Style.BorderColor / Style.BackColor / Style.Primary 等样式类"
    custom_theme: "继承 AntdUI.Style 注册全局默认（AntdUI.StyleManager）"
    color_mode: "Application.SetColorMode(SystemColorMode.System / Light / Dark)（.NET 9+，.NET 10 转正）"
  naming:
    color_prefix: "Style."
    font_prefix: "Font."
    spacing_prefix: "Space."
    radius_prefix: "Radius."
    shadow_prefix: "Shadow."
    duration_prefix: "Duration."
  rules:
    - "颜色、间距、圆角、阴影必须先落到统一主题入口与样式类，再在控件上引用"
    - "禁止在控件属性或 InitializeComponent 之外的代码中直接写十六进制色值与魔法字号"
    - "官方 SetColorMode 与组件库主题必须经同一主题入口联动切换，禁止并存两套切换路径"

layout:
  shell:
    app_min_width: 1024
    app_min_height: 640
    top_bar_height: 48
    side_nav_width_expanded: 232
    side_nav_width_collapsed: 64
    content_padding: 24
  page:
    section_gap: 24
    card_gap: 16
    form_column_gap: 16
    form_row_gap: 12
  responsive_rules:
    - "宽度低于 compact_width 时，次级面板优先折叠或转为抽屉"
    - "表格列过多时优先启用横向滚动，不强行压缩到不可读"
    - "主界面与工作台页必须在 100%、150%、200% DPI 下确认布局"

page_states:
  loading:
    required:
      - "首屏加载必须展示加载占位或进度环（AntdUI.Spin / AntdUI.Progress），禁止纯空白等待"
      - "局部加载优先使用区域级 loading，而不是整窗锁死"
  empty:
    required:
      - "必须包含标题、说明文案、建议动作（AntdUI.Empty 或等价组件）"
      - "空状态图形优先使用内置资源，不引入无关风格插画"
  error:
    required:
      - "必须展示错误说明、重试入口、必要时显示错误编号"
      - "错误文案要可理解，避免直接暴露底层异常堆栈"
  no_permission:
    required:
      - "必须明确说明缺少权限，不可伪装成空数据"
      - "若当前工具没有访问条件控制，可省略该状态"

icons:
  source:
    primary: "AntdUI 内置 SVG 图标 / IconPage"
    secondary: "矢量图标 / 素材图片"
  rules:
    - "图标尺寸优先使用 16、20、24"
    - "同一页面中的图标风格必须一致"
    - "业务图标优先语义明确，不使用纯装饰性图标堆砌"
    - "优先使用组件库内置图标，减少自定义图标资源"

navigation:
  winforms_implementation:
    pattern: "主窗体侧栏（AntdUI.Segmented / Menu 类控件）+ 内容容器 UserControl 替换"
    usage: "导航切换收敛在 NavigationService，内容区只承载 UserControl"
  rules:
    - "导航逻辑封装在 NavigationService 中"
    - "页面参数通过导航参数对象或 IMessenger 传递"
    - "支持当前页面高亮；需要前进/后退时维护导航栈"
    - "左侧导航默认展示一级模块，二级模块按业务需要展开"
    - "无窗体 / 托盘项目以托盘右键菜单为导航入口，菜单项状态与内部状态同步"

dialogs:
  winforms_implementation:
    control: "AntdUI.Modal / AntdUI.Dialog.show；确认框优先官方 TaskDialog；简单场景 TaskDialog / MessageBox"
    usage: "ShowDialog 阻塞调用需要异步语义时经 TaskCompletionSource 封装"
  rules:
    - "对话框必须使用独立 ViewModel，禁止 Code-behind 写业务逻辑"
    - "结果通过事件或 TaskCompletionSource 异步返回，禁止 UI 线程 .Result 同步等待"
    - "危险操作对话框必须突出后果与确认动作"
  sizes:
    sm: 420
    md: 640
    lg: 860

forms:
  rules:
    - "表单标签、输入框、帮助文本、错误文本垂直对齐"
    - "必填项明确标识，但不要满屏红色星号"
    - "校验错误紧贴字段展示，同时支持顶部汇总提示"
    - "保存按钮位置固定且可预测，避免用户重复寻找"
  density:
    compact: "用于高密度后台录入"
    regular: "用于普通配置和详情编辑"

tables:
  winforms_implementation:
    control: "AntdUI.Table 优先；复杂表格可用 DataGridView（Fluent 化样式）或 ObjectListView"
    notes: "同一项目内表格类控件只用一种实现，禁止混排"
  rules:
    - "表头固定语义清晰，避免缩写难懂"
    - "行高以 40-44 为基准，支持紧凑模式"
    - "操作列最多保留高频动作，低频动作放入 ContextMenu"
    - "加载、空态、错误态必须在表格容器内完整表达"

cards:
  winforms_implementation:
    control: "AntdUI.Card 或等价 UserControl 容器"
  rules:
    - "卡片用于聚合信息，不代替页面主结构"
    - "卡片标题、说明、操作区分层清晰"
    - "同页卡片的阴影和圆角保持一致"

feedback:
  winforms_implementation:
    snackbar: "AntdUI.Message（窗口内消息条）/ AntdUI.Notification（气泡）；托盘常驻通知用 NotifyIcon.ShowBalloonTip 兜底"
    progress: "AntdUI.Spin / AntdUI.Progress"
  notification:
    rules:
      - "成功提示短而明确"
      - "失败提示说明原因并提供下一步建议"
      - "批量操作完成后需要给出结果摘要"
  progress:
    rules:
      - "超过 300ms 的操作应展示进度反馈"
      - "可取消操作应提供取消入口"

motion:
  winforms_implementation:
    default: "优先使用 AntdUI 内置动画（可中断），不自写消息循环驱动的动画计时器"
  rules:
    - "页面进入动效时长不超过 slow (260ms)"
    - "Hover、Pressed、Focus 反馈优先使用透明度、阴影、边框变化"
    - "避免大面积缩放、弹跳、长时间旋转等强干扰动效"

mvvm:
  viewmodel:
    base_class: "ObservableObject"
    property_rule: "使用 [ObservableProperty]"
    command_rule: "使用 [RelayCommand]"
  messaging:
    tool: "IMessenger"
    rule: "跨 ViewModel 通信通过消息传递，禁止静态全局状态"
  collection_binding:
    rule:
      - "列表优先使用 BindingList<T> / ObservableCollection<T>（配合绑定适配）"
      - "复杂刷新优先批量更新，避免 Clear 后逐项 Add"
      - "异步加载必须支持 CancellationToken"
      - "后台线程更新集合必须编组回 UI 线程"
  dependency_injection:
    rule:
      - "ViewModel、Service、Repository、窗体通过构造函数注入依赖"
      - "服务按标记接口生命周期显式注册（RegisterBusinessServices 属 Azrng.AspNetCore.Core，桌面项目不使用）"

accessibility:
  rules:
    - "键盘导航可达：主要操作必须支持 Tab 焦点访问"
    - "焦点态可见，不允许只有鼠标 Hover 才能识别可操作项"
    - "文本与背景保持足够对比度，状态色不能只靠颜色区分"
    - "为交互控件设置 AccessibleName 和 AccessibleDescription"

testing:
  view:
    notes: "WinForms UI 自动化测试可使用 FlaUI；无窗体项目以运行冒烟 + 日志断言替代"
    rules:
      - "页面交互变化应补 UI 自动化测试（存在窗体时）"
      - "至少覆盖 loading、empty、error、no-permission 四类状态"
  logic:
    tool: "xUnit"
    rules:
      - "ViewModel 命令、属性变更、消息发送应有测试"
      - "Service 与 Repository 变更应补业务与数据访问测试"

do:
  - "使用统一主题入口与样式类管理视觉规则"
  - "使用语义化样式名称，而不是直接使用原始色值"
  - "使用 AntdUI 控件优先构建导航、对话框、基础控件体验"
  - "使用 ApplicationConfiguration.Initialize() 声明 DPI 与默认字体"
  - "让主界面左上角显示应用图标和应用名称"
  - "让所有可见按钮、菜单、操作入口都具备真实交互"
  - "为新增页面补齐 loading、empty、error、no-permission 状态"

dont:
  - "不要写 React、ECharts、Zustand、lucide-react 相关规则"
  - "不要在控件属性或初始化代码中硬编码颜色、间距、圆角"
  - "不要在 ViewModel 中直接操作控件或写导航细节"
  - "不要在后台线程直接更新 UI 控件"
  - "不要用假的删除、新增、编辑交互冒充真实业务逻辑"
  - "不要新增与现有主题体系并行的第二套设计规范"
  - "不要为了单次需求过度抽象共享控件"
  - "不要引入许可证不明确的 UI 组件库（GPL 或需商业授权的库先说明风险）"
