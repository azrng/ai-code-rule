# 设计与界面规则的唯一事实来源。
# 颜色、主题、字体、风格关键词当前为内置基线值：首次界面任务前按产品品牌定制，完成后把 meta.status 改为「已定制」
# status 为「已定制」后 use-ai-rule 重新生成不再覆盖本文件；结构契约与定制流程见界面子规则的设计系统小节
# 该文件面向人和 AI 共同使用：可读、可解析、非可执行、易于比对。
# 适用范围：不预设具体技术栈的通用项目；若项目没有界面层，可按需删减。

meta:
  name: "通用项目设计系统基线"
  version: "1.1.0"
  status: "基线待定制"
  owners:
    - "design"
    - "product"
    - "engineering"
  tech_stack:
    framework: "不预设具体前端、桌面、移动或服务端界面框架"
    styling: "项目现有样式体系、主题系统或设计 token 机制"
    typography: "项目统一字体方案"
    icons: "项目统一图标体系"
    forms: "项目统一表单与校验方案"
    state: "项目统一状态管理与数据获取方案"
  usage:
    read_order:
      - "先阅读 AGENTS.md，按根规则命中前端子规则"
      - "命中 frontend-AGENTS.md 后再阅读本文件"
      - "然后查看现有布局、组件、样式配置和字体配置"
    principles:
      - "优先复用已有布局、组件和 token"
      - "优先使用语义化 token，不直接写视觉常量"
      - "页面状态必须完整，不交付半成品视图"
      - "界面实现遵循项目现有技术栈，不维护平行视觉体系"

product:
  style_keywords:
    - "专业"
    - "可信"
    - "清晰"
    - "高效"
    - "克制"
  ui_goal:
    - "适合中后台、运营平台、业务系统、桌面工具或普通信息系统等通用场景"
    - "重要状态一眼可辨，表单、列表、详情和操作区层级清晰"
    - "若存在多端适配需求，应保证主要终端上的关键操作可完成"
    - "动效克制，不制造分散注意力的装饰"

tokens:
  colors:
    primary:
      50: "#EEF7FF"
      100: "#DAEDFF"
      200: "#BADFFF"
      300: "#8DCAFF"
      400: "#59ACFF"
      500: "#2A88F2"
      600: "#176DCE"
      700: "#1556A3"
      800: "#16457F"
      900: "#17385F"
    secondary:
      50: "#F2FBF7"
      100: "#DDF6EA"
      200: "#BFECD5"
      300: "#94DCB6"
      400: "#5FC592"
      500: "#359F6F"
      600: "#247F58"
      700: "#206548"
      800: "#1D513B"
      900: "#193F30"
    success:
      50: "#EEFDF3"
      100: "#DCFBE6"
      200: "#B7F4CB"
      300: "#82E8A4"
      400: "#45D775"
      500: "#22B85A"
      600: "#159245"
      700: "#14713A"
      800: "#145A31"
      900: "#134B2B"
    warning:
      50: "#FFF8E8"
      100: "#FDEFC7"
      200: "#FBDD8D"
      300: "#F7C957"
      400: "#EEAF2E"
      500: "#D88E15"
      600: "#B96D0E"
      700: "#97530F"
      800: "#7B4213"
      900: "#663714"
    error:
      50: "#FFF1F3"
      100: "#FFE1E5"
      200: "#FFC8D0"
      300: "#FF9DAC"
      400: "#FF6D84"
      500: "#ED4A67"
      600: "#CC304F"
      700: "#A9223F"
      800: "#8A2037"
      900: "#711E31"
    gray:
      50: "#F8FAFC"
      100: "#F1F5F9"
      200: "#E2E8F0"
      300: "#CBD5E1"
      400: "#94A3B8"
      500: "#64748B"
      600: "#475569"
      700: "#334155"
      800: "#1E293B"
      900: "#0F172A"

  semantic:
    text:
      primary: "gray.900"
      secondary: "gray.600"
      muted: "gray.500"
      disabled: "gray.400"
      inverse: "white"
      link: "primary.600"
      link_hover: "primary.700"
    background:
      page: "gray.50"
      panel: "white"
      subtle: "gray.100"
      raised: "white"
      active: "primary.50"
      brand: "primary.600"
    border:
      default: "gray.200"
      strong: "gray.300"
      focus: "primary.500"
      muted: "gray.100"
    status:
      success_bg: "success.50"
      success_text: "success.700"
      warning_bg: "warning.50"
      warning_text: "warning.700"
      error_bg: "error.50"
      error_text: "error.700"

  typography:
    font_family:
      sans: "'Segoe UI', 'PingFang SC', 'Microsoft YaHei', ui-sans-serif, system-ui, sans-serif"
      mono: "Consolas, 'SF Mono', monospace"
    font_size:
      xs: "12px"
      sm: "14px"
      base: "16px"
      lg: "18px"
      xl: "20px"
      2xl: "24px"
      3xl: "30px"
    font_weight:
      normal: 400
      medium: 500
      semibold: 600
      bold: 700
    line_height:
      tight: 1.25
      normal: 1.5
      relaxed: 1.7

  spacing:
    base_unit: "4px"
    scale:
      1: "4px"
      2: "8px"
      3: "12px"
      4: "16px"
      5: "20px"
      6: "24px"
      8: "32px"
      10: "40px"
      12: "48px"
      16: "64px"

  radius:
    sm: "6px"
    md: "10px"
    lg: "14px"
    xl: "20px"
    full: "9999px"

  shadow:
    xs: "0 1px 2px rgba(15, 23, 42, 0.04)"
    sm: "0 4px 12px rgba(15, 23, 42, 0.06)"
    md: "0 10px 30px rgba(15, 23, 42, 0.08)"
    lg: "0 18px 50px rgba(15, 23, 42, 0.12)"

  transitions:
    fast: "120ms"
    base: "200ms"
    slow: "320ms"

  breakpoints:
    sm: "640px"
    md: "768px"
    lg: "1024px"
    xl: "1280px"
    2xl: "1536px"

state_management:
  local_state:
    tool: "项目现有局部状态能力"
    use_for:
      - "表单输入过程"
      - "弹窗开关"
      - "局部 loading/error 状态"
      - "局部筛选、排序、临时交互反馈"
  global_state:
    tool: "项目统一状态管理方案"
    use_for:
      - "全局筛选条件"
      - "界面偏好"
      - "轻量通知"
      - "客户端临时共享状态"
    forbidden:
      - "把服务端分页列表整份塞进客户端全局状态"
      - "把主数据源作为唯一事实长期缓存到纯界面层 store 中"
  server_state:
    default_pattern: "沿用项目现有服务端取数、预取或缓存方案"
    mutation_pattern: "写操作后主动刷新受影响视图、数据或缓存"
    route_handler_pattern: "对外接口、跨端消费、文件流或集成调用"
  forms:
    library: "项目统一表单与校验方案"
    rule: "校验规则与业务 schema 共用，不允许页面自行维护一份平行校验"

page_states:
  required:
    - "loading"
    - "empty"
    - "error"
    - "not-found"
    - "no-permission"
  guidance:
    loading:
      implementation: "优先使用骨架屏、占位区或项目现有 loading 机制"
    empty:
      implementation: "说明当前为空的原因，并给出引导动作"
    error:
      implementation: "错误信息可读、可恢复，提供重试或返回路径"
    not_found:
      implementation: "资源不存在时使用项目现有的未找到机制，而不是展示空白页"
    no_permission:
      implementation: "明确提示权限不足，不暴露内部实现细节"

component_rules:
  reuse_first: true
  file_placement:
    pages: "页面、布局、视图入口"
    components: "通用组件与布局组件"
    features: "按业务域组织的复杂组件与页面块"
    services: "服务层、数据访问层、接口层、任务入口层"
  naming:
    components: "PascalCase 或项目统一组件命名规范"
    hooks: "camelCase、项目统一命名方式或框架约定"
    stores: "按项目统一命名方式"
    services: "camelCase 或 PascalCase，体现业务语义"
  rules:
    - "优先复用项目已有 Button、Input、Table、Dialog、Form 体系"
    - "共享组件必须具备明确复用价值"
    - "避免为单页面需求抽出无边界的大而全组件"

form_rules:
  layout:
    label_position: "标签在输入框上方"
    label_style: "中等强调文本"
    helper_text: "弱提示文本"
    error_text: "错误提示文本"
    field_gap: "字段间距使用 spacing.4"
    section_gap: "分组间距使用 spacing.6"
  validation:
    strategy: "blur + submit 双阶段校验"
    source_of_truth: "共享 schema 或统一校验规则"
    error_style: "边框、文案、图标同时反馈，禁止只靠颜色区分"
  submit_behavior:
    loading: "提交按钮 disabled 或不可重复触发，并展示 loading 提示"
    success: "明确反馈成功并刷新受影响区域"
    failure: "保留用户输入并提示可恢复原因"

responsive:
  principle: "移动优先"
  common_patterns:
    page_padding: "小屏紧凑，大屏留白更充足"
    grid: "优先单列，再按断点扩展多列"
    action_bar: "窄屏纵向堆叠，宽屏横向排列"
    sidebar: "根据项目形态选择固定侧栏、顶栏或抽屉式导航"
  rules:
    - "关键操作在移动端必须可点按，不依赖 hover"
    - "表格在小屏上优先转换为卡片列表或横向滚动容器"

do:
  - "优先复用 token、字体、布局和现有 ui 组件"
  - "保持页面状态完整：loading / empty / error / not-found / no-permission"
  - "使用语义化类名和设计 token，而不是视觉硬编码"
  - "桌面端与移动端都进行基本可用性检查"
  - "前后端字段、状态和错误语义保持一致"

dont:
  - "不要在客户端组件中直接访问数据库或服务端密钥"
  - "不要无约束地使用 inline style 或硬编码颜色/圆角/阴影/间距"
  - "不要把服务端主数据源长期塞进纯客户端全局状态"
  - "不要交付没有 loading / empty / error 状态的页面"
  - "不要为了单次需求额外引入新的样式体系、图标库或状态库"
