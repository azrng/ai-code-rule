# 设计与组件规则的唯一事实来源。
# 颜色、主题、字体、风格关键词当前为内置基线值：首次界面任务前按产品品牌定制，完成后把 meta.status 改为「已定制」
# status 为「已定制」后 use-rule 重新生成不再覆盖本文件；结构契约与定制流程见界面子规则的设计系统小节
# 该文件面向人和 AI 共同使用：可读、可解析、非可执行、易于比对。
# 技术栈：React（版本以仓库锁定为准）+ TypeScript + Ant Design 5 + ECharts + Zustand
# 注意：Wails 桌面应用，无 HTTP 后端，前后端通过 Wails 绑定通信

meta:
  name: "企业级应用设计系统"
  version: "2.2.0"
  status: "基线待定制"
  owners:
    - "design"
    - "frontend"
  tech_stack:
    styling: "Ant Design 5 Design Token + CSS Modules（唯一样式引擎）"
    icons: "@ant-design/icons（唯一图标库，尺寸 16-24px）"
    charts: "ECharts + echarts-for-react（唯一图表库）"
    state_global: "Zustand（跨组件全局状态）"
    state_local: "React Hooks（组件本地状态）"
  communication:
    method: "Wails 原生绑定（非 HTTP）"
    frontend_call: "通过 src/bindings/ 下自动生成的模块调用 Go 方法"
    rule: "禁止使用 HTTP 请求与 Go 后端通信，外部 API 通过 Axios 调用"
  usage:
    read_order:
      - "在进行任何 UI 改动前阅读本文件"
      - "然后查看 src/config/antd-theme.ts Ant Design 主题配置"
      - "然后查看 src/config/echarts-theme.ts 图表主题配置"
      - "然后再查看现有页面与组件实现"
    principles:
      - "优先复用，而不是重新发明"
      - "优先使用 Ant Design 组件和 Design Token，而不是硬编码视觉值"
      - "优先使用已有项目组件，而不是先写自定义组件"
      - "图表颜色统一来自 echarts-theme，不在页面层硬编码"
      - "以桌面窗口为主，不强制移动端响应式；窗口可调性以项目配置为准"

product:
  style_keywords:
    - "专业"
    - "清晰"
    - "可信"
    - "高效"
    - "现代"
  ui_goal:
    - "桌面应用界面优先保证清晰度与信息密度平衡"
    - "状态和反馈必须让用户一眼看懂"
    - "数据可视化图表风格统一、专业"

# ============================================================
# 颜色 Token
# 对应 Ant Design 5 Design Token 体系
# ============================================================
tokens:
  colors:
    # 主品牌色 - Ant Design 蓝
    primary:
      50: "#E6F4FF"
      100: "#BAE0FF"
      200: "#91CAFF"
      300: "#69B1FF"
      400: "#4096FF"
      500: "#1677FF" # Ant Design 默认主色，用于主按钮、链接、激活态
      600: "#0958D9" # hover 态
      700: "#003EB3" # active 态
      800: "#002C8C"
      900: "#001D66"

    # 成功色 - 企业绿
    success:
      50: "#F0FDF4"
      100: "#E6FBEE"
      200: "#BFFCE0"
      300: "#8FF7D0"
      400: "#5AE9BA"
      500: "#10B981" # 主成功色
      600: "#059669"
      700: "#047857"
      800: "#065F46"
      900: "#064E3B"

    # 警告色 - 企业橙
    warning:
      50: "#FEF3C7"
      100: "#FEE8B6"
      200: "#FDD48F"
      300: "#FBC15E"
      400: "#F9A825"
      500: "#F59E0B" # 主警告色
      600: "#D97706"
      700: "#B45309"
      800: "#92400E"
      900: "#78350F"

    # 错误色 - 企业红
    error:
      50: "#FEF2F2"
      100: "#FEE2E2"
      200: "#FECACA"
      300: "#FCA5A5"
      400: "#F87171"
      500: "#EF4444" # 主错误色
      600: "#DC2626"
      700: "#B91C1C"
      800: "#991B1B"
      900: "#7F1D1D"

    # 信息色
    info:
      50: "#EFF6FF"
      100: "#DBEAFE"
      500: "#1677FF"
      600: "#0958D9"

    # 中性色 - 灰度系
    gray:
      50: "#FAFBFC"
      100: "#F3F4F6"
      150: "#EBEEF2"
      200: "#E5E7EB"
      300: "#D1D5DB"
      400: "#9CA3AF"
      500: "#6B7280"
      600: "#4B5563"
      700: "#374151"
      800: "#1F2937"
      900: "#111827"

  # ============================================================
  # 语义化颜色映射（使用 Ant Design Design Token）
  # 优先使用 ConfigProvider theme token，而非硬编码颜色
  # ============================================================
  semantic:
    text:
      primary: "colorText" # Ant Design token: colorText
      secondary: "colorTextSecondary"
      disabled: "colorTextDisabled"
      inverse: "colorTextLightSolid"
      link: "colorPrimary"
      link_hover: "colorPrimaryHover"
    background:
      page: "colorBgLayout"
      container: "colorBgContainer"
      subtle: "colorBgContainer"
      active: "colorPrimaryBg"
    border:
      default: "colorBorderSecondary"
      strong: "colorBorder"
      focus: "colorPrimary"
    status:
      success_bg: "colorSuccessBg"
      success_text: "colorSuccess"
      warning_bg: "colorWarningBg"
      warning_text: "colorWarning"
      error_bg: "colorErrorBg"
      error_text: "colorError"
      info_bg: "colorInfoBg"
      info_text: "colorInfo"

  typography:
    font_family:
      sans: "-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
      mono: "SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace"
    font_size:
      xs: "12px" # text-xs
      sm: "14px" # text-sm（表格、辅助信息）
      base: "16px" # text-base（正文）
      md: "15px" # text-md
      lg: "18px" # text-lg（小标题）
      xl: "20px" # text-xl（标题）
      2xl: "24px" # text-2xl（页面标题）
      3xl: "30px" # text-3xl（大数字展示）
    font_weight:
      normal: 400
      medium: 500
      semibold: 600
      bold: 700
    line_height:
      tight: 1.2
      normal: 1.5
      relaxed: 1.75

  spacing:
    base_unit: "4px"
    scale:
      0.5: "2px"
      1: "4px"
      1.5: "6px"
      2: "8px"
      2.5: "10px"
      3: "12px"
      3.5: "14px"
      4: "16px"
      5: "20px"
      6: "24px"
      7: "28px"
      8: "32px"
      10: "40px"
      12: "48px"
      14: "56px"
      16: "64px"

  radius:
    none: "0"
    xs: "2px"
    sm: "4px"
    md: "6px"
    lg: "8px"
    xl: "12px"
    2xl: "16px"
    full: "9999px"

  shadow:
    none: "none"
    xs: "0 1px 2px 0 rgba(0,0,0,0.04)"
    sm: "0 1px 3px 0 rgba(0,0,0,0.08)"
    md: "0 4px 8px -2px rgba(0,0,0,0.10), 0 2px 4px -2px rgba(0,0,0,0.06)"
    lg: "0 10px 15px -3px rgba(0,0,0,0.10), 0 4px 6px -2px rgba(0,0,0,0.05)"
    xl: "0 20px 25px -5px rgba(0,0,0,0.10), 0 10px 10px -5px rgba(0,0,0,0.04)"

  transitions:
    fast: "100ms"
    base: "200ms"
    slow: "300ms"
    slower: "500ms"

# ============================================================
# ECharts 图表主题配置
# 具体实现文件：src/config/echarts-theme.ts
# ============================================================
echarts:
  theme_name: "enterprise"
  color_palette:
    - "#1677FF" # 主蓝（primary-500）
    - "#10B981" # 主绿（success-500）
    - "#F59E0B" # 主橙（warning-500）
    - "#EF4444" # 主红（error-500）
    - "#8B5CF6" # 紫
    - "#EC4899" # 粉
    - "#06B6D4" # 青
    - "#F97316" # 橙红
  grid:
    color: "#E5E7EB"
    label_color: "#6B7280"
    axis_color: "#D1D5DB"
  tooltip:
    bg: "#FFFFFF"
    border: "#E5E7EB"
    text: "#374151"
  legend:
    text_color: "#4B5563"
  font_family: "ui-sans-serif, system-ui, -apple-system, sans-serif"
  font_size:
    axis_label: 12
    tooltip: 13
    legend: 13
    title: 14
  usage_rules:
    - "所有图表通过 src/components/charts/ 下封装的组件使用，禁止页面直接使用 echarts-for-react"
    - "图表颜色统一引用 echarts-theme，禁止在 option 中硬编码颜色"
    - "图表容器必须设置明确的高度（className='h-64' 或 h-80 等）"
    - "图表组件必须处理 loading 和 empty 状态"
    - "tooltip、legend、axis 样式统一来自主题，不单独覆盖"

# ============================================================
# Ant Design 主题配置映射
# 通过 ConfigProvider theme token 统一管理
# ============================================================
ant_design:
  theme_config:
    location: "src/config/antd-theme.ts"
    description: "通过 ConfigProvider 的 theme.token 属性自定义主题"
    token_mapping:
      colorPrimary: "tokens.colors.primary.500 (#1677FF)"
      colorSuccess: "tokens.colors.success.500"
      colorWarning: "tokens.colors.warning.500"
      colorError: "tokens.colors.danger.500"
      colorInfo: "tokens.colors.info.500"
      colorBgLayout: "tokens.colors.gray.50"
      colorBgContainer: "tokens.colors.gray.50 (white)"
      borderRadius: "tokens.radius.md (6px)"
      fontSize: "tokens.typography.font_size.base (14px)"
  usage_rules:
    - "主题定制统一通过 ConfigProvider theme.token 配置"
    - "组件中使用 theme.useToken() 获取 token 值，禁止硬编码颜色"
    - "间距统一使用 Ant Design Space 组件或 token.marginXXS ~ token.marginXL"
    - "禁止使用 style={{}} 硬编码样式"

# ============================================================
# 状态管理规范
# ============================================================
state_management:
  local_state:
    tool: "React Hooks（useState、useReducer、useCallback、useEffect）"
    use_for:
      - "表单输入值"
      - "弹窗开关"
      - "单个组件的 loading/error 状态"
      - "本地筛选、排序、分页"
  global_state:
    tool: "Zustand"
    store_location: "src/store/"
    use_for:
      - "当前登录用户信息"
      - "权限与角色"
      - "侧边菜单折叠状态"
      - "全局通知/消息"
      - "跨页面共享的筛选条件"
      - "主题/语言配置"
    store_naming: "use[Domain]Store（如 useUserStore、usePermissionStore）"
    forbidden:
      - "Redux"
      - "MobX"
      - "Recoil"
      - "Context API 用于业务状态（仅允许用于主题/语言等低频配置）"

# ============================================================
# 页面状态规范
# ============================================================
page_states:
  required:
    - "loading"
    - "empty"
    - "error"
    - "no-permission"
  guidance:
    loading:
      description: "数据加载中"
      implementation: "列表/表格用骨架屏（Skeleton），按钮操作用 disabled + spinner"
    empty:
      description: "无数据"
      implementation: "展示空状态图示 + 简短说明 + 引导操作按钮"
    error:
      description: "请求失败"
      implementation: "展示可读的错误原因，提供重试按钮"
    no_permission:
      description: "权限不足"
      implementation: "明确说明权限不足，不暴露内部实现细节"

# ============================================================
# 组件使用规则
# ============================================================
component_rules:
  reuse_first: true
  naming:
    components: "PascalCase"
    hooks: "camelCase，以 use 开头"
    stores: "camelCase，以 use 开头，以 Store 结尾"
    utils: "camelCase"
  custom_component_policy:
    - "只有在确实存在复用价值时才新增共享组件"
    - "避免为了单次需求做过度抽象"
    - "组件职责保持单一"
  categories:
    layout:
      description: "布局组件"
      location: "src/components/layout/"
      examples:
        - "PageContainer（页面容器，统一 padding）"
        - "SectionCard（分区卡片）"
    ui:
      description: "优先使用 Ant Design 组件，不重复造轮子"
      location: "src/components/common/"
      examples:
        - "Button（主/次/幽灵/危险变体）"
        - "Badge（状态标签）"
        - "StatCard（数据统计卡片）"
        - "StatusTag（业务状态标签）"
        - "Table（数据表格）"
        - "Form（表单）"
        - "Input（文本输入框）"
        - "Select（下拉选择器）"
        - "Checkbox（多选框）"
        - "Radio（单选框）"
        - "Switch（开关）"
        - "DatePicker（日期选择器）"
        - "Upload（文件上传）"
        - "Pagination（分页）"
        - "Tag（标签）"
        - "Tooltip（文字提示）"
        - "Popover（气泡卡片）"
        - "Progress（进度条）"
        - "Avatar（头像）"
        - "Modal（弹窗）"
        - "Drawer（抽屉）"
        - "Alert（内联提示）"
        - "message / notification（轻提示/通知）"
        - "Steps（步骤条）"
        - "Tabs（标签页）"
        - "Breadcrumb（面包屑）"
        - "Collapse（折叠面板）"
        - "Divider（分割线）"
        - "Skeleton（骨架屏）"
        - "Spin（加载中）"
        - "Empty（空状态）"
    charts:
      description: "ECharts 封装图表组件"
      location: "src/components/charts/"
      examples:
        - "BarChartCard（柱状图卡片）"
        - "LineChartCard（折线图卡片）"
        - "PieChartCard（饼图卡片）"
        - "TrendChart（趋势图）"
      rules:
        - "统一封装 loading、empty、error 状态"
        - "统一传入 title、height、className"
        - "颜色通过 echarts-theme 注入，不接受外部 color prop"

# ============================================================
# 表单规范
# ============================================================
form_rules:
  layout:
    label_position: "标签在输入框上方（top），企业表单标准布局"
    label_style: "text-sm font-medium text-gray-700"
    required_mark: "标签后紧跟红色星号 *"
    helper_text: "输入框下方，text-xs text-gray-500"
    error_text: "输入框下方，text-xs text-error-600，替换 helper_text 位置"
    field_gap: "垂直间距 gap-4（16px），分组间距 gap-6（24px）"
    section_gap: "表单分区间距 gap-8（32px）"
  sizes:
    sm:
      description: "紧凑型，用于筛选栏、内联表单"
      antd_size: "small"
    md:
      description: "默认尺寸，企业表单标准"
      antd_size: "middle"
    lg:
      description: "宽松型，用于登录、注册等关键表单"
      antd_size: "large"
  validation:
    trigger: "onBlur 失焦校验为主，提交时全量校验"
    error_border: "Ant Design Form 自动处理 validateStatus 和 help"
    success_border: "Ant Design Form 自动处理 validateStatus"
  submit_behavior:
    loading_state: "提交按钮 disabled + loading spinner，防止重复提交"
    reset_policy: "提交成功后根据业务场景决定是否重置，不强制"

# ============================================================
# 组件详细规范（Ant Design 组件配置规范）
# ============================================================
component_specs:
  input:
    description: "Ant Design Input 文本输入框"
    library: "Ant Design Input"
    variants:
      default: "单行文本输入"
      textarea: "Input.TextArea，autoSize={{ minRows: 3 }}"
      password: "Input.Password，自带切换可见图标"
      search: "Input.Search，自带搜索按钮和清除功能"
      number: "InputNumber，数字输入"
    rules:
      - "使用 Form.Item 的 rules 进行校验"
      - "错误状态由 Form 自动管理（validateStatus + help）"

  select:
    description: "Ant Design Select 下拉选择器"
    library: "Ant Design Select"
    variants:
      single: "默认单选，allowClear 可清除"
      multiple: "mode=\"multiple\"，选中项以 Tag 展示"
      searchable: "showSearch={true}，启用搜索"
      group: "OptGroup 分组"
    rules:
      - "超过 5 个选项时建议启用 showSearch"
      - "选项过多（>50）时使用 virtual 模式"

  table:
    description: "Ant Design Table 数据表格"
    library: "Ant Design Table"
    features:
      sortable: "sorter 属性"
      fixed_column: "fixed=\"right\" / fixed=\"left\""
      expandable: "expandable 配置"
      row_selection: "rowSelection 配置"
    rules:
      - "操作列固定在最右侧 fixed=\"right\""
      - "必须处理 loading、empty、error 三种状态"
      - "超长文本使用 ellipsis={{ showTitle: false }} + Tooltip"

  modal:
    description: "Ant Design Modal 弹窗"
    library: "Ant Design Modal"
    sizes:
      sm: "width={400}"
      md: "width={520}"
      lg: "width={720}"
      xl: "width={960}"
    rules:
      - "弹窗层级不超过 2 层"
      - "表单弹窗提交按钮须有 loading 态"
      - "危险操作使用 danger 类型确认按钮"

  drawer:
    description: "Ant Design Drawer 抽屉"
    library: "Ant Design Drawer"
    sizes:
      sm: "width={320}"
      md: "width={384}"
      lg: "width={512}"
      xl: "width={640}"
    rules:
      - "详情查看/编辑用 Drawer，需用户聚焦决策用 Modal"

  alert:
    description: "Ant Design Alert 内联提示"
    library: "Ant Design Alert"
    variants:
      info: "type=\"info\""
      success: "type=\"success\""
      warning: "type=\"warning\""
      error: "type=\"error\""
    rules:
      - "Alert 用于页面级持久提示，message 用于操作结果短暂反馈"

  toast:
    description: "Ant Design message / notification"
    library: "Ant Design message（轻提示）/ notification（通知）"
    rules:
      - "成功操作使用 message.success()"
      - "失败操作使用 message.error()"
      - "文案简洁，15 字以内"

  tabs:
    description: "Ant Design Tabs 标签页"
    library: "Ant Design Tabs"
    rules:
      - "禁止超过 8 个 Tab，超出用 Select 代替"

  menu:
    description: "Ant Design Menu 侧边导航菜单"
    library: "Ant Design Menu"
    rules:
      - "多级菜单最多 2 层，禁止 3 层嵌套"
      - "折叠模式下通过 Tooltip 展示菜单名称"

  pagination:
    description: "Ant Design Pagination 分页器"
    library: "Ant Design Pagination"
    rules:
      - "每页条数变更时重置到第 1 页"
      - "总数为 0 时不展示分页器"

  skeleton:
    description: "Ant Design Skeleton 骨架屏"
    library: "Ant Design Skeleton"
    rules:
      - "表格 loading 用骨架行替换，不用全页 Spin 遮罩"

  empty:
    description: "Ant Design Empty 空状态"
    library: "Ant Design Empty"
    rules:
      - "空状态描述需根据具体场景定制"

icons:
  library: "@ant-design/icons"
  sizes:
    default: 18
    medium: 20
    large: 24
  usage_rules:
    - "统一从 @ant-design/icons 导入，禁止自定义 SVG 或其他图标库"
    - "尺寸统一用 style={{ fontSize: 20 }}"
    - "颜色通过 style 控制：style={{ fontSize: 20, color: token.colorPrimary }}"
    - "禁止使用 <img src='icon.svg' /> 或 <i className='fa-...' />"

# ============================================================
# 响应式设计规范
# ============================================================
responsive:
  principle: "布局以桌面端为主，不强制移动端适配"
  note: "窗口可调性以项目配置为准；可调窗口需处理窄宽度下的布局"

# ============================================================
# Do / Don't 规则
# ============================================================
do:
  - "优先复用现有组件和页面模式"
  - "优先使用 Ant Design 组件和 Design Token（token.colorPrimary 而非硬编码颜色）"
  - "保持完整的页面状态反馈（loading/empty/error/no-permission）"
  - "图表颜色统一来自 echarts-theme 配置文件"
  - "全局状态使用 Zustand store，本地状态使用 React Hooks"
  - "图标统一使用 @ant-design/icons"
  - "主题定制统一通过 ConfigProvider theme token 配置"
  - "通过 Wails 绑定调用 Go 后端，禁止 HTTP 请求"
  - "Wails 绑定调用封装在 hooks 或 store 中"

dont:
  - "不要使用 style={{}} 属性硬编码样式"
  - "不要硬编码颜色值（如 #1677ff）"
  - "不要硬编码间距数值（如 padding: '20px'）"
  - "不要使用 ECharts 以外的图表库（Recharts、Chart.js 等）"
  - "不要在图表 option 中硬编码颜色，必须引用 echarts-theme"
  - "不要使用 Redux、MobX、Recoil"
  - "不要在组件中直接调用后端 API，统一通过 src/api/ 封装（外部服务）或 Wails 绑定（本地 Go）"
  - "不要交付缺少 loading、empty、error 状态的页面"
  - "不要再创建新的设计 token 文件或平行配置体系"
  - "不要使用 @ant-design/icons 以外的图标库"
  - "不要在没有充分复用价值的情况下创建新共享组件"
  - "不要在 Tooltip 内放置可交互元素（按钮/链接），应使用 Popover"
  - "不要嵌套超过 2 层弹窗（Modal/Drawer）"
  - "不要超过 8 个 Tab，超出用 Select 代替"
  - "不要在侧边导航菜单中嵌套超过 2 层菜单"
  - "不要在表格/列表数据加载时使用全页 Spin 遮罩，应使用 Skeleton"
  - "不要使用 class 组件，必须使用函数组件 + Hooks"
  - "不要使用 HTTP 请求与 Go 后端通信，必须通过 Wails 绑定"
  - "不要手动修改 src/bindings/ 下的自动生成文件"
