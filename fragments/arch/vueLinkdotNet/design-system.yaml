    title_style: "text-sm font-semibold（可选）"
    body_style: "text-sm"
    closable: "X size=16 ml-auto flex-shrink-0，text-current opacity-60 hover:opacity-100"
    action_link: "text-sm font-medium underline ml-4（可选）"
    rules:
      - "Alert 用于页面级别的持久提示，Toast 用于操作结果的短暂反馈"
      - "不在 Alert 中放置复杂交互元素，最多一个操作链接"

  toast:
    description: "轻提示，操作结果反馈，自动消失"
    variants:
      success: "bg-white border border-success-200，CheckCircle size=18 text-success-500"
      error: "bg-white border border-error-200，AlertCircle size=18 text-error-500"
      warning: "bg-white border border-warning-200，AlertTriangle size=18 text-warning-500"
      info: "bg-white border border-gray-200，Info size=18 text-primary-500"
    structure: "flex items-center gap-3 px-4 py-3 rounded-xl shadow-lg min-w-64 max-w-sm"
    message: "text-sm text-gray-700 flex-1"
    close_button: "X size=14 text-gray-400 hover:text-gray-600 ml-2"
    position: "右上角（默认）：fixed top-4 right-4 z-[60]"
    stack: "多条 Toast 垂直排列，gap-2，最多同时显示 5 条"
    duration:
      default: "3000ms 自动关闭"
      error: "5000ms（错误信息需要更多阅读时间）"
      persistent: "duration=0 不自动关闭，需手动关闭"
    animation: "slide-in from right + fade，slide-out + fade，duration-200"
    rules:
      - "成功操作使用 success Toast，失败使用 error Toast，不混用"
      - "Toast 文案简洁，15 字以内，详细信息引导用户查看页面"
      - "同类型操作的连续 Toast 合并展示，不堆叠刷屏"

  # ----------------------------------------------------------
  # 导航类
  # ----------------------------------------------------------

  steps:
    description: "步骤条，展示多步骤流程的进度"
    variants:
      horizontal: "步骤水平排列，桌面端默认"
      vertical: "步骤垂直排列，适合步骤数多或移动端"
    step_states:
      pending: "圆圈 border-2 border-gray-300 bg-white text-gray-400，步骤序号或图标"
      active: "圆圈 bg-primary-500 text-white border-2 border-primary-500，当前步骤"
      done: "圆圈 bg-primary-500 border-primary-500，内部 Check size=14 text-white"
      error: "圆圈 bg-error-500 border-error-500，内部 X size=14 text-white"
      disabled: "圆圈 bg-gray-100 border-gray-200 text-gray-300，不可点击"
    step_indicator:
      size: "w-8 h-8 rounded-full flex items-center justify-center text-sm font-semibold"
    connector_line:
      horizontal: "flex-1 h-0.5 mx-2 bg-gray-200（pending），bg-primary-500（done）"
      vertical: "w-0.5 h-8 mx-auto my-1 bg-gray-200（pending），bg-primary-500（done）"
    labels:
      title: "text-sm font-medium，active: text-primary-600，done: text-gray-700，pending: text-gray-400"
      description: "text-xs text-gray-400 mt-0.5（可选）"
    clickable: "已完成的步骤可点击回退，pending 步骤不可跳跃点击"
    rules:
      - "步骤条只展示状态，不承担内容展示职责，内容区域独立"
      - "移动端步骤数超过 4 个时切换为 vertical 或仅展示当前步骤进度"

  tabs:
    description: "标签页，同一内容区域的多视图切换"
    variants:
      line:
        description: "下划线型，默认，适合内容区较大的场景"
        tab_default: "px-4 py-2.5 text-sm text-gray-500 border-b-2 border-transparent hover:text-gray-700 hover:border-gray-300"
        tab_active: "text-primary-600 border-b-2 border-primary-500 font-medium"
        container: "border-b border-gray-200 flex gap-1"
      card:
        description: "卡片型，适合功能分区明确的场景"
        tab_default: "px-4 py-2 text-sm text-gray-500 bg-gray-100 rounded-t-lg hover:bg-gray-200"
        tab_active: "text-gray-900 bg-white border border-b-0 border-gray-200 font-medium"
      pill:
        description: "胶囊型，适合数量少（2-4个）的紧凑场景"
        container: "bg-gray-100 p-1 rounded-lg inline-flex"
        tab_default: "px-4 py-1.5 text-sm text-gray-500 rounded-md hover:text-gray-700"
        tab_active: "bg-white text-gray-900 font-medium shadow-sm"
    badge_on_tab: "tab 标题右侧跟 Badge（数字），ml-2"
    disabled_tab: "text-gray-300 cursor-not-allowed，禁止点击"
    sizes:
      sm: "text-xs px-3 py-2"
      md: "text-sm px-4 py-2.5" # 默认
      lg: "text-base px-5 py-3"
    rules:
      - "Tab 切换不重新发起请求（数据已缓存），切换即时响应"
      - "Tab 内容区域的 loading 状态独立处理，不影响 Tab 本身"
      - "禁止超过 8 个 Tab，超出考虑用 Select/下拉切换代替"

  breadcrumb:
    description: "面包屑导航，展示当前页面在层级中的位置"
    structure: "flex items-center gap-1 text-sm"
    item_default: "text-gray-500 hover:text-gray-700 cursor-pointer"
    item_current: "text-gray-900 font-medium cursor-default"
    separator: "ChevronRight size=14 text-gray-400 flex-shrink-0"
    max_items: "超过 4 层时，中间层级折叠为 ... ，点击展开"
    collapsed_trigger: "... 文字，text-gray-400 hover:text-gray-600 cursor-pointer"
    home_icon: "可选，Home size=16 作为第一项"
    rules:
      - "最后一项（当前页）不可点击"
      - "面包屑文字与页面标题保持一致"

  menu:
    description: "侧边导航菜单，企业后台主导航"
    layout:
      sidebar_width: "w-64（展开），w-16（折叠）"
      transition: "transition-all duration-300 ease-in-out"
    container: "h-full bg-white border-r border-gray-200 flex flex-col"
    logo_area: "h-16 flex items-center px-4 border-b border-gray-100"
    menu_section:
      label: "px-4 py-2 text-xs font-semibold text-gray-400 uppercase tracking-wider（分组标签）"
    menu_item:
      default: "flex items-center gap-3 px-4 py-2.5 text-sm text-gray-600 rounded-lg mx-2 hover:bg-gray-100 hover:text-gray-900 cursor-pointer"
      active: "bg-primary-50 text-primary-700 font-medium"
      icon: "size=18 flex-shrink-0"
      label: "flex-1 truncate"
      badge: "ml-auto，Badge xs 尺寸"
    submenu:
      indent: "pl-10（二级菜单缩进）"
      indicator: "ChevronRight size=14 ml-auto，展开时 rotate-90，duration-200"
      item_style: "text-sm text-gray-500 hover:text-gray-800，py-2 px-4"
      active: "text-primary-600 font-medium"
    collapsed_mode:
      item: "justify-center px-0，隐藏文字"
      tooltip: "悬停展示菜单项名称 Tooltip，position=right"
      section_label: "隐藏"
    collapse_button: "底部固定，ChevronLeft/ChevronRight size=18"
    rules:
      - "折叠状态下必须通过 Tooltip 展示菜单名称"
      - "多级菜单最多 2 层，禁止 3 层嵌套"
      - "激活项的父级菜单自动展开"

  # ----------------------------------------------------------
  # 布局增强类
  # ----------------------------------------------------------

  collapse:
    description: "折叠面板，展示/隐藏内容区域"
    variants:
      accordion: "手风琴模式，同一时间只有一项展开"
      multiple: "多展开模式，各项独立控制"
    header:
      style: "flex items-center justify-between px-4 py-3 cursor-pointer hover:bg-gray-50 select-none"
      title: "text-sm font-medium text-gray-800"
      icon: "ChevronDown size=16 text-gray-400，展开时 rotate-180，duration-200 transition-transform"
      icon_position: "right（默认）/ left"
    content:
      style: "px-4 pb-4 text-sm text-gray-600"
      animation: "overflow-hidden，高度 0 → auto，duration-200（需 JS 辅助实现精确动画）"
    container:
      bordered: "border border-gray-200 rounded-lg divide-y divide-gray-100（默认）"
      ghost: "无边框，仅分割线，适合嵌入卡片中"
    rules:
      - "禁止在折叠内容中放置表格等需要固定高度的复杂组件，避免动画异常"

  divider:
    description: "分割线"
    variants:
      horizontal: "w-full h-px bg-gray-200（默认）"
      vertical: "h-full w-px bg-gray-200，inline-block mx-3"
    with_text:
      style: "flex items-center gap-3"
      line: "flex-1 h-px bg-gray-200"
      text: "text-xs text-gray-400 font-medium whitespace-nowrap"
    margin:
      horizontal: "my-4（默认）"
      vertical: "mx-3（默认）"
    rules:
      - "装饰性分割线使用 <hr> 或 div，不使用 border 属性"

  skeleton:
    description: "骨架屏，内容加载时的占位动画"
    base: "animate-pulse bg-gray-200 rounded"
    variants:
      text_line: "h-4 rounded w-full（可指定宽度百分比）"
      text_short: "h-4 rounded w-3/5"
      title: "h-5 rounded w-2/5 mb-3"
      avatar: "rounded-full（对应 Avatar 尺寸）"
      image: "rounded-lg（对应图片区域比例）"
      button: "h-9 rounded-lg w-24"
      card: "组合：title + 2-3 行 text_line"
      table_row: "h-12 rounded w-full"
    colors:
      base: "bg-gray-200"
      highlight: "bg-gray-100（shimmer 效果中的高亮部分，可选）"
    rules:
      - "骨架屏结构应尽量贴近真实内容布局，避免视觉跳变"
      - "骨架行数与真实数据行数保持一致（通常 3-5 行）"
      - "表格 loading 用骨架行替换 tbody，不用全页 Spin 遮罩"

  spin:
    description: "加载中，页面级或局部容器级遮罩"
    variants:
      inline: "纯图标，不带遮罩，嵌入按钮或内容流中"
      container: "相对定位的父容器内覆盖，半透明遮罩 + 居中 spinner"
      fullpage: "fixed inset-0 覆盖全页，z-[100]"
    spinner:
      style: "Loader2 size=24 text-primary-500 animate-spin"
      sizes:
        sm: "size=16"
        md: "size=24" # 默认
        lg: "size=32"
    overlay:
      container: "absolute inset-0 bg-white/70 flex items-center justify-center z-10 rounded-lg"
      fullpage: "fixed inset-0 bg-white/80 flex items-center justify-center z-[100]"
    loading_text: "text-sm text-gray-500 mt-2（可选）"
    rules:
      - "表格/列表数据加载优先使用 Skeleton，不用 Spin 遮罩"
      - "Spin 适用于提交、保存等操作的等待状态"
      - "全页 Spin 仅用于页面初始化加载，不用于局部操作"
icons:
  library: "Element Plus Icons（@element-plus/icons-vue）"
  sizes:
    default: 18
    medium: 20
    large: 24
  usage_rules:
    - "统一从 @element-plus/icons-vue 导入，禁止自定义 SVG 或其他图标库"
    - "尺寸统一用 :size prop：<ElIcon :size=\"20\"><component :is=\"Search\" /></ElIcon>"
    - "颜色通过 style 或 CSS 类控制"
    - "禁止使用 <img src='icon.svg' /> 或 <i class='fa-...' />"

# ============================================================
# 响应式设计规范
# ============================================================
responsive:
  principle: "移动优先（Mobile First）"
  breakpoints:
    xs: "< 768px（手机/小平板）"
    sm: "768px - 平板"
    md: "992px - 小桌面"
    lg: "1200px - 桌面"
    xl: "1920px - 宽屏"
  common_patterns:
    grid_cols: "el-row + el-col :span='24' :md='{span: 12}' :lg='{span: 8}'"
    padding: "页面内边距 p-4 md:p-6 lg:p-8"
    text_size: "text-sm md:text-base lg:text-lg"
    sidebar_width: "w-full lg:w-64"

# ============================================================
# Do / Don't 规则
# ============================================================
do:
  - "优先复用现有组件和页面模式"
  - "优先使用 Element Plus 组件和 CSS 变量"
  - "保持完整的页面状态反馈（loading/empty/error/no-permission）"
  - "图表颜色统一来自 echarts-theme 配置文件"
  - "全局状态使用 Pinia store，组件本地状态使用 Vue Composition API（ref、reactive、computed）"
  - "图标统一使用 @element-plus/icons-vue"
  - "响应式遵循移动优先原则"
  - "同时关注桌面端与移动端可读性"

dont:
  - "不要使用 style 属性硬编码样式"
  - "不要硬编码颜色值（如 #409EFF）"
  - "不要使用内联 CSS 数值（如 padding: '20px'）"
  - "不要使用 ECharts 以外的图表库（Recharts、Chart.js 等）"
  - "不要在图表 option 中硬编码颜色，必须引用 echarts-theme"
  - "不要使用 Vuex Options API"
  - "不要在组件中直接调用后端 API，统一通过 src/api/ 封装"
  - "不要交付缺少 loading、empty、error 状态的页面"
  - "不要再创建新的设计 token 文件或平行配置体系"
  - "不要使用 @element-plus/icons-vue 以外的图标库"
  - "不要在没有充分复用价值的情况下创建新共享组件"
  - "不要在 Tooltip 内放置可交互元素（按钮/链接），应使用 Popover"
  - "不要嵌套超过 2 层弹窗（ElDialog/ElDrawer）"
  - "不要使用 ECharts 以外的图表库，不要用 Recharts、Chart.js 等"
  - "不要超过 8 个 ElTabs，超出用 ElSelect 代替"
  - "不要在侧边导航菜单中嵌套超过 2 层菜单"
  - "不要在表格/列表数据加载时使用全页 v-loading 遮罩，应使用 ElSkeleton"
