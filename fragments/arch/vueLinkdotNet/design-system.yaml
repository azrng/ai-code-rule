# 设计与组件规则的唯一事实来源。
# 颜色、主题、字体、风格关键词当前为内置基线值：首次界面任务前按产品品牌定制，完成后把 meta.status 改为「已定制」
# status 为「已定制」后 use-rule 重新生成不再覆盖本文件；结构契约与定制流程见界面子规则的设计系统小节
# 该文件面向人和 AI 共同使用：可读、可解析、非可执行、易于比对。
# 技术栈：Vue 3 + TypeScript + Element Plus + ECharts + Pinia

meta:
  name: "企业级应用设计系统"
  version: "2.0.0"
  status: "基线待定制"
  owners:
    - "design"
    - "frontend"
  tech_stack:
    styling: "Element Plus SCSS + CSS 变量（唯一样式引擎）"
    icons: "Element Plus Icons（@element-plus/icons-vue，唯一图标库，尺寸 18-24px）"
    charts: "ECharts + vue-echarts（唯一图表库）"
    state_global: "Pinia（跨组件全局状态）"
    state_local: "Vue Composition API（ref、reactive、computed）"
  default_ports:
    frontend: 3000 # Vue 开发服务器 / 容器内端口
    backend: 8080 # .NET Web API / 容器内端口
    database: 5432 # PostgreSQL / 容器内端口
  api_base_url:
    env_var: "VITE_API_BASE_URL"
    default: "http://localhost:8080"
    rule: "前端所有 API 请求统一读取此环境变量，禁止在代码中硬编码后端地址"
  port_conflict_policy: "宿主机端口冲突时，优先调整 docker-compose.yml 中的宿主机映射端口，容器内端口保持不变，并同步更新 .env.example 和前端配置"
  usage:
    read_order:
      - "在进行任何 UI 改动前阅读本文件"
      - "然后查看 src/config/echarts-theme.ts 图表主题配置"
      - "然后再查看现有页面与组件实现"
    principles:
      - "优先复用，而不是重新发明"
      - "优先使用 Element Plus 组件和 CSS 变量，而不是硬编码视觉值"
      - "优先使用已有项目组件，而不是先写自定义组件"
      - "图表颜色统一来自 echarts-theme，不在页面层硬编码"

product:
  style_keywords:
    - "专业"
    - "清晰"
    - "可信"
    - "高效"
    - "现代"
  ui_goal:
    - "企业后台界面优先保证清晰度与信息密度平衡"
    - "移动端界面需要保证触控舒适"
    - "状态和反馈必须让用户一眼看懂"
    - "数据可视化图表风格统一、专业"

# ============================================================
# 颜色 Token
# 对应 Element Plus CSS 变量体系
# 使用方式：var(--el-color-primary) 或 Element Plus 组件属性
# ============================================================
tokens:
  colors:
    # 主品牌色 - 企业蓝
    primary:
      50: "#EEF4FF"
      100: "#E0EBFF"
      200: "#B3D9FF"
      300: "#80C1FF"
      400: "#4DA8FF"
      500: "#1A90FF" # 主色，用于主按钮、链接、激活态
      600: "#0078E0" # hover 态
      700: "#0052CC" # active 态
      800: "#003DA5"
      900: "#002880"

    # 成功色 - 企业绿
    success:
      50: "#F0FDF4"
      100: "#E6FBEE"
      200: "#BFFCE0"
      300: "#8FF7D0"
      400: "#5AE9BA"
      500: "#10B981" # 主成功色
      600: "#059669"
      700: "#047857"
      800: "#065F46"
      900: "#064E3B"

    # 警告色 - 企业橙
    warning:
      50: "#FEF3C7"
      100: "#FEE8B6"
      200: "#FDD48F"
      300: "#FBC15E"
      400: "#F9A825"
      500: "#F59E0B" # 主警告色
      600: "#D97706"
      700: "#B45309"
      800: "#92400E"
      900: "#78350F"

    # 错误色 - 企业红
    error:
      50: "#FEF2F2"
      100: "#FEE2E2"
      200: "#FECACA"
      300: "#FCA5A5"
      400: "#F87171"
      500: "#EF4444" # 主错误色
      600: "#DC2626"
      700: "#B91C1C"
      800: "#991B1B"
      900: "#7F1D1D"

    # 信息色
    info:
      50: "#EFF6FF"
      100: "#DBEAFE"
      500: "#1A90FF"
      600: "#0078E0"

    # 中性色 - 灰度系
    gray:
      50: "#FAFBFC"
      100: "#F3F4F6"
      150: "#EBEEF2"
      200: "#E5E7EB"
      300: "#D1D5DB"
      400: "#9CA3AF"
      500: "#6B7280"
      600: "#4B5563"
      700: "#374151"
      800: "#1F2937"
      900: "#111827"

  # ============================================================
  # 语义化颜色映射（使用 Element Plus CSS 变量）
  # 优先使用 Element Plus 的 CSS 变量，而非硬编码色值
  # ============================================================
  semantic:
    text:
      primary: "var(--el-text-color-primary)" # 主文本
      secondary: "var(--el-text-color-secondary)" # 次要文本
      disabled: "var(--el-text-color-disabled)" # 禁用文本
      inverse: "var(--el-color-white)" # 反色文本（深色背景上）
      link: "var(--el-color-primary)" # 链接
      link_hover: "var(--el-color-primary-light-3)"
    background:
      page: "var(--el-bg-color-page)" # 页面背景
      container: "var(--el-bg-color)" # 卡片/面板背景
      subtle: "var(--el-fill-color-light)" # 次级区块背景
      active: "var(--el-color-primary-light-9)" # 激活/选中背景
    border:
      default: "var(--el-border-color-lighter)" # 默认边框
      strong: "var(--el-border-color)" # 强调边框
      focus: "var(--el-color-primary)" # 焦点边框
    status:
      success_bg: "var(--el-color-success-light-9)"
      success_text: "var(--el-color-success)"
      warning_bg: "var(--el-color-warning-light-9)"
      warning_text: "var(--el-color-warning)"
      error_bg: "var(--el-color-danger-light-9)"
      error_text: "var(--el-color-danger)"
      info_bg: "var(--el-color-info-light-9)"
      info_text: "var(--el-color-info)"

  typography:
    font_family:
      sans: "ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
      mono: "'SF Mono', 'Monaco', 'Consolas', monospace"
    font_size:
      xs: "12px" # text-xs
      sm: "14px" # text-sm（表格、辅助信息）
      base: "16px" # text-base（正文）
      md: "15px" # text-md
      lg: "18px" # text-lg（小标题）
      xl: "20px" # text-xl（标题）
      2xl: "24px" # text-2xl（页面标题）
      3xl: "30px" # text-3xl（大数字展示）
    font_weight:
      normal: 400 # font-normal
      medium: 500 # font-medium
      semibold: 600 # font-semibold
      bold: 700 # font-bold
    line_height:
      tight: 1.2 # leading-tight
      normal: 1.5 # leading-normal
      relaxed: 1.75 # leading-relaxed

  spacing:
    base_unit: "4px"
    # 使用 Element Plus 间距规范和 SCSS 变量，禁止硬编码数值
    scale:
      0.5: "2px" # 0.5
      1: "4px" # p-1, m-1
      1.5: "6px" # p-1.5
      2: "8px" # p-2
      2.5: "10px" # p-2.5
      3: "12px" # p-3
      3.5: "14px" # p-3.5
      4: "16px" # p-4
      5: "20px" # p-5
      6: "24px" # p-6
      7: "28px" # p-7
      8: "32px" # p-8
      10: "40px" # p-10
      12: "48px" # p-12
      14: "56px" # p-14
      16: "64px" # p-16

  radius:
    none: "0"
    xs: "2px" # rounded-sm（2px）
    sm: "4px" # rounded（4px）
    md: "6px" # rounded-md
    lg: "8px" # rounded-lg（标准）
    xl: "12px" # rounded-xl
    2xl: "16px" # rounded-2xl
    full: "9999px" # rounded-full

  shadow:
    none: "none" # shadow-none
    xs: "0 1px 2px 0 rgba(0,0,0,0.04)" # shadow-xs
    sm: "0 1px 3px 0 rgba(0,0,0,0.08)" # shadow-sm
    md: "0 4px 8px -2px rgba(0,0,0,0.10), 0 2px 4px -2px rgba(0,0,0,0.06)" # shadow-md
    lg: "0 10px 15px -3px rgba(0,0,0,0.10), 0 4px 6px -2px rgba(0,0,0,0.05)" # shadow-lg
    xl: "0 20px 25px -5px rgba(0,0,0,0.10), 0 10px 10px -5px rgba(0,0,0,0.04)" # shadow-xl

  transitions:
    fast: "100ms" # duration-100
    base: "200ms" # duration-200（标准）
    slow: "300ms" # duration-300
    slower: "500ms" # duration-500

  breakpoints:
    xs: "320px"
    sm: "640px" # 手机横屏/小平板
    md: "768px" # 平板
    lg: "1024px" # 桌面
    xl: "1280px" # 宽屏
    2xl: "1536px" # 超宽屏

# ============================================================
# ECharts 图表主题配置
# 具体实现文件：src/config/echarts-theme.ts
# 所有图表颜色、字体、网格、tooltip 均来自此配置
# ============================================================
echarts:
  theme_name: "enterprise"
  color_palette:
    - "#1A90FF" # 主蓝（primary-500）
    - "#10B981" # 主绿（success-500）
    - "#F59E0B" # 主橙（warning-500）
    - "#EF4444" # 主红（error-500）
    - "#8B5CF6" # 紫
    - "#EC4899" # 粉
    - "#06B6D4" # 青
    - "#F97316" # 橙红
  grid:
    color: "#E5E7EB" # gray-200
    label_color: "#6B7280" # gray-500
    axis_color: "#D1D5DB" # gray-300
  tooltip:
    bg: "#FFFFFF"
    border: "#E5E7EB"
    text: "#374151" # gray-700
  legend:
    text_color: "#4B5563" # gray-600
  font_family: "ui-sans-serif, system-ui, -apple-system, sans-serif"
  font_size:
    axis_label: 12
    tooltip: 13
    legend: 13
    title: 14
  usage_rules:
    - "所有图表通过 src/components/charts/ 下封装的组件使用，禁止页面直接使用 vue-echarts"
    - "图表颜色统一引用 echarts-theme，禁止在 option 中硬编码颜色"
    - "图表容器必须设置明确的高度（style='height: 320px' 或使用 CSS 类）"
    - "图表组件必须处理 loading 和 empty 状态"
    - "tooltip、legend、axis 样式统一来自主题，不单独覆盖"

# ============================================================
# Element Plus 主题配置映射
# 通过 SCSS 变量覆盖 + CSS 变量实现主题定制
# ============================================================
element_plus:
  theme_overrides:
    location: "src/config/element-theme.ts 或 vite.config.ts 中的 Element Plus SCSS 变量覆盖"
    description: "通过 element-plus 的 SCSS 变量和 CSS 变量自定义主题颜色"
    scss_variables:
      "--el-color-primary": "tokens.colors.primary.500 (#409EFF)"
      "--el-color-success": "tokens.colors.success.500 (#67C23A)"
      "--el-color-warning": "tokens.colors.warning.500 (#E6A23C)"
      "--el-color-danger": "tokens.colors.danger.500 (#F56C6C)"
      "--el-color-info": "tokens.colors.gray.500 (#909399)"
      "--el-border-radius-base": "tokens.radius.md (4px)"
      "--el-font-size-base": "tokens.typography.font_size.sm (14px)"
  usage_rules:
    - "优先使用 Element Plus 组件内置属性和 CSS 变量"
    - "禁止使用 style 属性硬编码样式"
    - "间距统一使用 Element Plus 间距规范或 SCSS 变量"
    - "响应式使用 Element Plus 的 el-row / el-col 栅格系统"
    - "主题定制通过 SCSS 变量覆盖，不使用 CSS-in-JS"

# ============================================================
# 状态管理规范
# ============================================================
state_management:
  local_state:
    tool: "Vue Composition API（ref、reactive、computed、watch、onMounted）"
    use_for:
      - "表单输入值"
      - "弹窗开关"
      - "单个组件的 loading/error 状态"
      - "本地筛选、排序、分页"
  global_state:
    tool: "Pinia"
    store_location: "src/stores/"
    use_for:
      - "当前登录用户信息"
      - "权限与角色"
      - "侧边菜单折叠状态"
      - "全局通知/消息"
      - "跨页面共享的筛选条件"
      - "主题/语言配置"
    store_naming: "use[Domain]Store（如 useUserStore、usePermissionStore）"
    forbidden:
      - "Vuex Options API"
      - "Vuex Event Bus"
      - "provide/inject 用于业务状态（仅允许用于组件通信的低频场景）"

# ============================================================
# 页面状态规范
# ============================================================
page_states:
  required:
    - "loading"
    - "empty"
    - "error"
    - "no-permission"
  guidance:
    loading:
      description: "数据加载中"
      implementation: "列表/表格用 el-skeleton 骨架屏，按钮操作用 disabled + el-icon loading"
      example: "<el-skeleton :rows=\"5\" animated />"
    empty:
      description: "无数据"
      implementation: "展示空状态图示 + 简短说明 + 引导操作按钮"
    error:
      description: "请求失败"
      implementation: "展示可读的错误原因，提供重试按钮"
    no_permission:
      description: "权限不足"
      implementation: "明确说明权限不足，不暴露内部实现细节"

# ============================================================
# 组件使用规则
# ============================================================
component_rules:
  reuse_first: true
  naming:
    components: "PascalCase（.vue 文件）"
    composables: "camelCase，以 use 开头（useXxx.ts）"
    stores: "camelCase，以 use 开头，以 Store 结尾（useXxxStore.ts）"
    utils: "camelCase"
  custom_component_policy:
    - "只有在确实存在复用价值时才新增共享组件"
    - "避免为了单次需求做过度抽象"
    - "组件职责保持单一"
  categories:
    layout:
      description: "布局组件"
      location: "src/components/layout/"
      examples:
        - "PageContainer（页面容器，统一 padding）"
        - "SectionCard（分区卡片）"
        - "AppMain（主布局）"
        - "AppSidebar（侧边栏）"
        - "AppNavbar（导航栏）"
    ui:
      description: "优先使用 Element Plus 组件，不重复造轮子"
      location: "src/components/common/"
      examples:
        - "ElButton（主/次/幽灵/危险/文字变体）"
        - "ElBadge（状态标签）"
        - "ElTag（标签/筛选条件）"
        - "ElTable（数据表格）"
        - "ElForm（表单）"
        - "ElInput（文本输入框）"
        - "ElSelect（下拉选择器）"
        - "ElCheckbox（多选框）"
        - "ElRadio（单选框）"
        - "ElSwitch（开关）"
        - "ElDatePicker（日期选择器）"
        - "ElUpload（文件上传）"
        - "ElPagination（分页）"
        - "ElTooltip（文字提示）"
        - "ElPopover（气泡卡片）"
        - "ElProgress（进度条）"
        - "ElAvatar（头像）"
        - "ElDialog（弹窗）"
        - "ElDrawer（抽屉）"
        - "ElAlert（内联提示）"
        - "ElMessage / ElNotification（轻提示/通知）"
        - "ElSteps（步骤条）"
        - "ElTabs（标签页）"
        - "ElBreadcrumb（面包屑）"
        - "ElCollapse（折叠面板）"
        - "ElDivider（分割线）"
        - "ElSkeleton（骨架屏）"
        - "ElLoading / v-loading（加载中）"
        - "ElEmpty（空状态）"
    charts:
      description: "ECharts 封装图表组件"
      location: "src/components/charts/"
      examples:
        - "BarChartCard（柱状图卡片）"
        - "LineChartCard（折线图卡片）"
        - "PieChartCard（饼图卡片）"
        - "TrendChart（趋势图）"
      rules:
        - "统一封装 loading、empty、error 状态"
        - "统一传入 title、height、className"
        - "颜色通过 echarts-theme 注入，不接受外部 color prop"

# ============================================================
# 表单规范
# ============================================================
form_rules:
  layout:
    label_position: "标签在输入框上方（top），企业表单标准布局"
    label_style: "text-sm font-medium text-gray-700"
    required_mark: "标签后紧跟红色星号 *"
    helper_text: "输入框下方，text-xs text-gray-500"
    error_text: "输入框下方，text-xs text-danger-600，替换 helper_text 位置"
    field_gap: "垂直间距 mb-4（16px），分组间距 mb-6（24px）"
    section_gap: "表单分区间距 mb-8（32px）"
  sizes:
    sm:
      description: "紧凑型，用于筛选栏、内联表单，      el_size: "small"
    md:
      description: "默认尺寸，企业表单标准"
      el_size: "default"
    lg:
      description: "宽松型，用于登录、注册等关键表单"
      el_size: "large"
  validation:
    trigger: "使用 el-form 的 rules 配置，blur 失焦校验为主，提交时全量校验"
    error_border: "Element Plus 自动添加 is-error 类名"
    success_border: "Element Plus 自动添加 is-success 类名"
  submit_behavior:
    loading_state: "提交按钮 :loading=\"true\" :disabled=\"true\"，防止重复提交"
    reset_policy: "提交成功后根据业务场景决定是否重置，不强制"

# ============================================================
# 组件详细规范
# ============================================================
component_specs:
  # ----------------------------------------------------------
  # 数据输入类
  # ----------------------------------------------------------

  input:
    description: "文本输入框，企业表单最基础组件"
    sizes:
      sm: "h-8 px-3 text-sm"
      md: "h-10 px-3 text-sm" # 默认
      lg: "h-12 px-4 text-base"
    states:
      default: "border border-gray-300 rounded-lg bg-white text-gray-900 placeholder:text-gray-400"
      hover: "border-gray-400"
      focus: "border-primary-500 ring-2 ring-primary-100 outline-none"
      error: "border-error-500 ring-2 ring-error-100"
      disabled: "bg-gray-100 border-gray-200 text-gray-400 cursor-not-allowed"
      readonly: "bg-gray-50 border-gray-200 text-gray-700 cursor-default"
    variants:
      default: "单行文本输入"
      textarea: "多行文本，min-h-[80px]，可 resize-y"
      password: "type=password，右侧切换可见图标（Eye/EyeOff，size=16）"
      search: "左侧 Search 图标（size=16, text-gray-400），右侧可清除按钮"
    adornments:
      prefix_icon: "左侧图标，pl-9，图标 absolute left-3，size=16，text-gray-400"
      suffix_icon: "右侧图标，pr-9，图标 absolute right-3，size=16，text-gray-400"
      prefix_text: "左侧文字单元（如 http://），bg-gray-50 border-r border-gray-300 px-3，rounded-l-lg"
      suffix_text: "右侧文字单元（如 元），bg-gray-50 border-l border-gray-300 px-3，rounded-r-lg"
    rules:
      - "禁止使用 outline-none 而不补充 ring/border 焦点样式"
      - "placeholder 颜色统一 placeholder:text-gray-400"
      - "错误状态不依赖颜色单独传达，需同时展示错误文字"

  select:
    description: "下拉选择器，支持单选、多选、搜索"
    library: "使用 Element Plus 的 el-select 组件，自带搜索、多选、虚拟滚动"
    sizes:
      sm: "h-8 px-3 text-sm"
      md: "h-10 px-3 text-sm" # 默认
      lg: "h-12 px-4 text-base"
    trigger_states:
      default: "border border-gray-300 rounded-lg bg-white text-gray-900"
      hover: "border-gray-400"
      focus: "border-primary-500 ring-2 ring-primary-100"
      open: "border-primary-500 ring-2 ring-primary-100"
      error: "border-error-500 ring-2 ring-error-100"
      disabled: "bg-gray-100 border-gray-200 text-gray-400 cursor-not-allowed"
    dropdown:
      container: "bg-white border border-gray-200 rounded-lg shadow-lg mt-1 z-50 max-h-60 overflow-y-auto"
      option_default: "px-3 py-2 text-sm text-gray-700 cursor-pointer"
      option_hover: "bg-gray-50"
      option_selected: "bg-primary-50 text-primary-700 font-medium"
      option_disabled: "text-gray-400 cursor-not-allowed"
      group_label: "px-3 py-1.5 text-xs font-semibold text-gray-500 uppercase tracking-wide"
    variants:
      single: "默认单选，右侧 ChevronDown 图标 size=16 text-gray-400"
      multiple: "多选模式，选中项以 Tag 形式展示在 trigger 内，可逐个删除"
      searchable: "trigger 内嵌 input，可过滤选项列表，Search 图标 size=16"
      clearable: "有值时右侧展示 X 清除按钮（size=14），替换 ChevronDown"
    placeholder: "text-gray-400"
    rules:
