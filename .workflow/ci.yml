version: '1.0'
name: ai-rule-readonly-ci
displayName: AI Rule 只读验证
triggers:
  trigger: auto
  push:
    branches:
      include:
        - master
        - simplify
        - guided-wizard-detect
  pr:
    branches:
      include:
        - master
stages:
  - name: verify
    displayName: 构建、测试与规则校验
    strategy: naturally
    trigger: auto
    steps:
      - step: shell@agent
        name: build
        displayName: dotnet build
        script: dotnet build ai-code-rule.slnx
      - step: shell@agent
        name: test
        displayName: dotnet test
        script: dotnet test ai-code-rule.slnx --no-build
      - step: shell@agent
        name: rule_assembler_check
        displayName: RuleAssembler --check
        script: dotnet run --project app/RuleAssembler/RuleAssembler.csproj --no-build -- --check
      - step: shell@agent
        name: publish_self_contained
        displayName: self-contained 发布矩阵（win/linux/osx）
        script: bash app/RuleAssembler/publish.sh
      - step: shell@agent
        name: published_smoke
        displayName: 发布产物冒烟（linux 二进制跑 --check）
        script: ./dist/use-ai-rule-linux-x64 --check
