# 设计与组件规则的唯一事实来源。
# 该文件面向人和 AI 共同使用：可读、可解析、非可执行、易于比对。
# 技术栈：React + TypeScript + Tailwind CSS + shadcn/ui + lucide-react + recharts(可选) + Zustand
# 设计体系：Tailwind + shadcn/ui；图标 lucide-react；图表 recharts（可选）。

meta:
  name: "AI 应用设计系统"
  version: "1.0.0"
  last_updated: "2026-07-11"
  status: "启用中"
  owners:
    - "design"
    - "frontend"
  tech_stack:
    styling: "Tailwind CSS + shadcn CSS 变量（唯一样式引擎）"
    components: "shadcn/ui（复制式组件，落在 src/components/ui/，基于 Radix UI）"
    variants: "class-variance-authority + clsx + tailwind-merge（shadcn 标配）"
    icons: "lucide-react（唯一图标库，尺寸 16-24px）"
    charts: "recharts（可选，shadcn 原生图表方案）"
    state_global: "Zustand（跨组件全局状态，含 Agent 会话与消息流）"
    state_local: "React Hooks（组件本地状态）"
  default_ports:
    frontend: 3000 # React + Vite 开发服务器 / 容器内端口
    backend: 8080 # ASP.NET Core / 容器内端口
    database_pg: 5432 # PostgreSQL（可选）/ 容器内端口
    database_sqlite: "无端口（默认，文件卷挂载持久化）"
  api_base_url:
    env_var: "VITE_API_BASE_URL"
    default: "http://localhost:8080"
    rule: "前端所有 API 请求统一读取此环境变量，禁止在代码中硬编码后端地址"
  port_conflict_policy: "宿主机端口冲突时，优先调整 docker-compose.yml 中的宿主机映射端口，容器内端口保持不变，并同步更新 .env.example 和前端配置"
  usage:
    read_order:
      - "在进行任何 UI 改动前阅读本文件"
      - "然后查看 src/styles/globals.css（shadcn CSS 变量）与 tailwind.config.ts（主题映射）"
      - "然后查看 src/components/ui/ 下已有 shadcn 组件"
      - "然后再查看现有页面与业务组件实现"
    principles:
      - "优先复用 shadcn 组件与已有业务组件，而不是重新发明"
      - "优先使用语义化 Tailwind 类 / shadcn CSS 变量，而不是硬编码视觉值"
      - "shadcn 未覆盖且有复用价值时，才新增自定义组件"
      - "图表颜色统一来自主题，不在页面层硬编码"

product:
  style_keywords:
    - "专业"
    - "清晰"
    - "可信"
    - "高效"
    - "现代"
  ui_goal:
    - "AI 应用界面优先保证 Agent 输出的可读性与可操作性"
    - "结构化产物（候选 / 大纲 / 草稿 / 步骤）必须可被选择、确认、编辑"
    - "状态和反馈必须让用户一眼看懂（含流式中断 / 错误 / 空响应）"
    - "移动端界面需要保证触控舒适"
    - "数据可视化图表风格统一、专业"

# ============================================================
# 颜色 Token
# 落地为 Tailwind 自定义颜色（tailwind.config.ts）与 shadcn CSS 变量（globals.css，HSL）
# 使用方式：className="bg-primary-500 text-error-600" 或 shadcn 语义类 "bg-primary text-primary-foreground"
# ============================================================
tokens:
  colors:
    # 主品牌色
    primary:
      50: "#E6F4FF"
      100: "#BAE0FF"
      200: "#91CAFF"
      300: "#69B1FF"
      400: "#4096FF"
      500: "#1677FF" # 主色，用于主按钮、链接、激活态
      600: "#0958D9" # hover 态
      700: "#003EB3" # active 态
      800: "#002C8C"
      900: "#001D66"

    # 成功色
    success:
      50: "#F0FDF4"
      100: "#E6FBEE"
      200: "#BFFCE0"
      300: "#8FF7D0"
      400: "#5AE9BA"
      500: "#10B981" # 主成功色
      600: "#059669"
      700: "#047857"
      800: "#065F46"
      900: "#064E3B"

    # 警告色
    warning:
      50: "#FEF3C7"
      100: "#FEE8B6"
      200: "#FDD48F"
      300: "#FBC15E"
      400: "#F9A825"
      500: "#F59E0B" # 主警告色
      600: "#D97706"
      700: "#B45309"
      800: "#92400E"
      900: "#78350F"

    # 错误色（danger / destructive）
    error:
      50: "#FEF2F2"
      100: "#FEE2E2"
      200: "#FECACA"
      300: "#FCA5A5"
      400: "#F87171"
      500: "#EF4444" # 主错误色
      600: "#DC2626"
      700: "#B91C1C"
      800: "#991B1B"
      900: "#7F1D1D"

    # 信息色
    info:
      50: "#EFF6FF"
      100: "#DBEAFE"
      500: "#1A90FF"
      600: "#0078E0"

    # 中性色 - 灰度系
    gray:
      50: "#FAFBFC"
      100: "#F3F4F6"
      150: "#EBEEF2"
      200: "#E5E7EB"
      300: "#D1D5DB"
      400: "#9CA3AF"
      500: "#6B7280"
      600: "#4B5563"
      700: "#374151"
      800: "#1F2937"
      900: "#111827"

  # ============================================================
  # 语义化颜色映射
  # 优先使用 shadcn CSS 变量语义类（bg-primary / text-muted-foreground 等）
  # 其次使用 Tailwind 调色板类（bg-primary-500 / text-gray-700）
  # 两者不得在同一组件内混用造成两套视觉
  # ============================================================
  semantic:
    shadcn_css_vars: # 定义在 src/styles/globals.css，:root 与 .dark 双套
      background: "--background"
      foreground: "--foreground"
      card: "--card"
      card_foreground: "--card-foreground"
      primary: "--primary"
      primary_foreground: "--primary-foreground"
      secondary: "--secondary"
      secondary_foreground: "--secondary-foreground"
      muted: "--muted"
      muted_foreground: "--muted-foreground"
      accent: "--accent"
      accent_foreground: "--accent-foreground"
      destructive: "--destructive"
      destructive_foreground: "--destructive-foreground"
      border: "--border"
      input: "--input"
      ring: "--ring"
    tailwind_palette: # 直接调色板类，用于需要具体色阶的场景
      success: "success-500"
      warning: "warning-500"
      error: "error-500"
      info: "info-500"

  typography:
    font_family:
      sans: "-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
      mono: "SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace"
    font_size:
      xs: "12px" # text-xs
      sm: "14px" # text-sm（表格、辅助信息）
      base: "16px" # text-base（正文）
      md: "15px" # text-md
      lg: "18px" # text-lg（小标题）
      xl: "20px" # text-xl（标题）
      2xl: "24px" # text-2xl（页面标题）
      3xl: "30px" # text-3xl（大数字展示）
    font_weight:
      normal: 400 # font-normal
      medium: 500 # font-medium
      semibold: 600 # font-semibold
      bold: 700 # font-bold
    line_height:
      tight: 1.2 # leading-tight
      normal: 1.5 # leading-normal
      relaxed: 1.75 # leading-relaxed

  spacing:
    base_unit: "4px"
    # 使用 Tailwind 间距工具类，禁止硬编码数值
    scale:
      0.5: "2px"
      1: "4px" # p-1, m-1
      1.5: "6px" # p-1.5
      2: "8px" # p-2
      2.5: "10px" # p-2.5
      3: "12px" # p-3
      3.5: "14px" # p-3.5
      4: "16px" # p-4
      5: "20px" # p-5
      6: "24px" # p-6
      7: "28px" # p-7
      8: "32px" # p-8
      10: "40px" # p-10
      12: "48px" # p-12
      14: "56px" # p-14
      16: "64px" # p-16

  radius:
    none: "0"
    xs: "2px" # rounded-sm
    sm: "4px" # rounded
    md: "6px" # rounded-md
    lg: "8px" # rounded-lg（标准）
    xl: "12px" # rounded-xl
    2xl: "16px" # rounded-2xl
    full: "9999px" # rounded-full

  shadow:
    none: "none"
    xs: "0 1px 2px 0 rgba(0,0,0,0.04)"
    sm: "0 1px 3px 0 rgba(0,0,0,0.08)"
    md: "0 4px 8px -2px rgba(0,0,0,0.10), 0 2px 4px -2px rgba(0,0,0,0.06)"
    lg: "0 10px 15px -3px rgba(0,0,0,0.10), 0 4px 6px -2px rgba(0,0,0,0.05)"
    xl: "0 20px 25px -5px rgba(0,0,0,0.10), 0 10px 10px -5px rgba(0,0,0,0.04)"

  transitions:
    fast: "100ms" # duration-100
    base: "200ms" # duration-200（标准）
    slow: "300ms" # duration-300
    slower: "500ms" # duration-500

  breakpoints:
    xs: "320px"
    sm: "640px" # 手机横屏/小平板
    md: "768px" # 平板
    lg: "1024px" # 桌面
    xl: "1280px" # 宽屏
    2xl: "1536px" # 超宽屏

# ============================================================
# shadcn / Tailwind 主题配置映射
# 主题统一通过 globals.css 的 CSS 变量 + tailwind.config.ts 映射管理
# ============================================================
shadcn_tailwind:
  css_vars_location: "src/styles/globals.css"
  tailwind_config_location: "tailwind.config.ts"
  theme_rules:
    - "主题色统一来自 shadcn CSS 变量（--primary、--destructive 等），明暗双套（:root / .dark）"
    - "Tailwind 调色板（primary/success/warning/error/info/gray）在 tailwind.config.ts 注册，供需要具体色阶的场景使用"
    - "组件优先用 shadcn 语义类（bg-primary text-primary-foreground），需要色阶时用调色板类（bg-primary-500）"
    - "暗色模式通过 .dark 类切换 CSS 变量，不另建第二套颜色"
    - "组件变体统一用 class-variance-authority，类名合并统一用 cn()（clsx + tailwind-merge）"
  token_mapping:
    primary: "tokens.colors.primary.500 (#1677FF)"
    success: "tokens.colors.success.500"
    warning: "tokens.colors.warning.500"
    destructive: "tokens.colors.error.500"
    info: "tokens.colors.info.500"
    border: "tokens.colors.gray.200"
    radius: "tokens.radius.md (6px)"

# ============================================================
# 图表配置（可选，recharts）
# 仅在确实需要图表时引入；封装在 src/components/charts/
# ============================================================
charts:
  library: "recharts（shadcn/ui charts 原生方案，可选）"
  color_palette:
    - "#1A90FF" # 主蓝（primary-500）
    - "#10B981" # 主绿（success-500）
    - "#F59E0B" # 主橙（warning-500）
    - "#EF4444" # 主红（error-500）
    - "#8B5CF6" # 紫
    - "#EC4899" # 粉
    - "#06B6D4" # 青
    - "#F97316" # 橙红
  usage_rules:
    - "图表颜色统一引用主题色，禁止在 option / 配置中硬编码颜色"
    - "图表容器必须设置明确的高度（className='h-64' 或 h-80 等）"
    - "图表组件必须处理 loading 和 empty 状态"
    - "tooltip、legend、axis 样式统一来自封装，不单独覆盖"

# ============================================================
# 状态管理规范
# ============================================================
state_management:
  local_state:
    tool: "React Hooks（useState、useReducer、useCallback、useEffect）"
    use_for:
      - "表单输入值"
      - "弹窗开关"
      - "单个组件的 loading/error 状态"
      - "本地筛选、排序、分页"
  global_state:
    tool: "Zustand"
    store_location: "src/stores/"
    use_for:
      - "当前登录用户信息"
      - "权限与角色"
      - "侧边菜单折叠状态"
      - "全局通知/消息"
      - "Agent 会话列表与当前会话"
      - "流式消息增量缓冲"
      - "主题/语言配置"
    store_naming: "use[Domain]Store（如 useUserStore、useChatStore、useAgentStore）"
    forbidden:
      - "Redux"
      - "MobX"
      - "Recoil"
      - "Context API 用于业务状态（仅允许用于主题/语言等低频配置）"

# ============================================================
# 页面状态规范（AI 应用新增 streaming 状态）
# ============================================================
page_states:
  required:
    - "loading"
    - "streaming"
    - "empty"
    - "error"
    - "no-permission"
  guidance:
    loading:
      description: "数据加载中"
      implementation: "列表/表格用骨架屏（Skeleton），按钮操作用 disabled + spinner"
      tailwind_example: "animate-pulse bg-gray-200 rounded"
    streaming:
      description: "Agent 正在流式输出"
      implementation: "打字机增量渲染 + 进行中指示 + 可取消；区分流式中与已完成"
      tailwind_example: "streaming 时显示 typing 指示与 Stop 按钮"
    empty:
      description: "无数据"
      implementation: "展示空状态图示 + 简短说明 + 引导操作按钮"
    error:
      description: "请求失败或模型异常"
      implementation: "展示可读的错误原因（不暴露 SDK 细节），提供重试按钮"
    no_permission:
      description: "权限不足"
      implementation: "明确说明权限不足，不暴露内部实现细节"

# ============================================================
# 组件使用规则
# ============================================================
component_rules:
  reuse_first: true
  shadcn_first: true
  naming:
    components: "PascalCase"
    hooks: "camelCase，以 use 开头"
    stores: "camelCase，以 use 开头，以 Store 结尾"
    utils: "camelCase"
  custom_component_policy:
    - "shadcn 已覆盖的基础组件，优先用 CLI 拉取（npx shadcn@latest add <component>）到 src/components/ui/，再定制"
    - "只有在 shadcn 未覆盖、且确实存在复用价值时才新增自定义业务组件"
    - "避免为了单次需求做过度抽象"
    - "组件职责保持单一"
  categories:
    layout:
      description: "布局组件"
      location: "src/components/layout/"
      examples:
        - "PageContainer（页面容器，统一 padding）"
        - "SectionCard（分区卡片）"
    ui:
      description: "shadcn/ui 基础组件（复制式）"
      location: "src/components/ui/"
      examples:
        - "Button（通过 cva 定义 variant：default/destructive/outline/secondary/ghost/link）"
        - "Input / Textarea / Label"
        - "Select（shadcn）"
        - "Checkbox / RadioGroup / Switch"
        - "Dialog（弹窗）/ Sheet（抽屉）"
        - "Tooltip / Popover / HoverCard"
        - "Tabs / Accordion / Breadcrumb"
        - "Toast（sonner 或 shadcn useToast）"
        - "Alert"
        - "Skeleton"
        - "Avatar"
        - "Badge"
        - "Table"
        - "Progress"
    agent:
      description: "Agent 输出相关业务组件"
      location: "src/components/agent/"
      examples:
        - "MessageBubble（消息气泡，含流式打字机）"
        - "StreamingTypewriter（流式打字机）"
        - "CandidateList（候选选题 / 选项列表）"
        - "OutlineEditor（大纲编辑区）"
        - "DraftPreview（草稿预览）"
        - "StepNav（工作流步骤导航）"
        - "ConfirmAction（高风险确认按钮）"
    charts:
      description: "recharts 封装图表组件（可选）"
      location: "src/components/charts/"
      examples:
        - "BarChartCard（柱状图卡片）"
        - "LineChartCard（折线图卡片）"
        - "PieChartCard（饼图卡片）"
      rules:
        - "统一封装 loading、empty、error 状态"
        - "统一传入 title、height、className"
        - "颜色通过主题注入，不接受外部 color prop"

# ============================================================
# 表单规范
# ============================================================
form_rules:
  layout:
    label_position: "标签在输入框上方（top），标准布局"
    label_style: "text-sm font-medium text-gray-700"
    required_mark: "标签后紧跟红色星号 * ，使用 text-error-500"
    helper_text: "输入框下方，text-xs text-gray-500"
    error_text: "输入框下方，text-xs text-error-600，替换 helper_text 位置"
    field_gap: "垂直间距 gap-4（16px），分组间距 gap-6（24px）"
    section_gap: "表单分区间距 gap-8（32px）"
  sizes:
    sm:
      height: "h-8"
      padding: "px-3 py-1.5"
      text: "text-sm"
      description: "紧凑型，用于筛选栏、内联表单"
    md:
      height: "h-10"
      padding: "px-3 py-2"
      text: "text-sm"
      description: "默认尺寸，标准表单"
    lg:
      height: "h-12"
      padding: "px-4 py-3"
      text: "text-base"
      description: "宽松型，用于登录、注册等关键表单"
  validation:
    trigger: "onBlur 失焦校验为主，提交时全量校验"
    error_border: "border-error-500 focus:border-error-500 focus:ring-error-100"
    success_border: "border-success-500"
    error_icon: "InputAdornment 右侧 AlertCircle 图标，text-error-500，size=16"
  submit_behavior:
    loading_state: "提交按钮 disabled + Loader2 旋转图标，防止重复提交"
    reset_policy: "提交成功后根据业务场景决定是否重置，不强制"

# ============================================================
# 组件详细规范（Tailwind 原生，图标用 lucide-react）
# ============================================================
component_specs:
  # ----------------------------------------------------------
  # 数据输入类
  # ----------------------------------------------------------

  input:
    description: "文本输入框（shadcn Input）"
    sizes:
      sm: "h-8 px-3 text-sm"
      md: "h-10 px-3 text-sm" # 默认
      lg: "h-12 px-4 text-base"
    states:
      default: "border border-gray-300 rounded-lg bg-white text-gray-900 placeholder:text-gray-400"
      hover: "border-gray-400"
      focus: "border-primary-500 ring-2 ring-primary-100 outline-none"
      error: "border-error-500 ring-2 ring-error-100"
      disabled: "bg-gray-100 border-gray-200 text-gray-400 cursor-not-allowed"
      readonly: "bg-gray-50 border-gray-200 text-gray-700 cursor-default"
    variants:
      default: "单行文本输入"
      textarea: "多行文本（shadcn Textarea），min-h-[80px]，可 resize-y"
      password: "type=password，右侧切换可见图标（Eye / EyeOff，size=16）"
      search: "左侧 Search 图标（size=16, text-gray-400），右侧可清除按钮"
    adornments:
      prefix_icon: "左侧图标，pl-9，图标 absolute left-3，size=16，text-gray-400"
      suffix_icon: "右侧图标，pr-9，图标 absolute right-3，size=16，text-gray-400"
      prefix_text: "左侧文字单元（如 http://），bg-gray-50 border-r border-gray-300 px-3，rounded-l-lg"
      suffix_text: "右侧文字单元（如 元），bg-gray-50 border-l border-gray-300 px-3，rounded-r-lg"
    rules:
      - "禁止使用 outline-none 而不补充 ring/border 焦点样式"
      - "placeholder 颜色统一 placeholder:text-gray-400"
      - "错误状态不依赖颜色单独传达，需同时展示错误文字"

  select:
    description: "下拉选择器，支持单选、多选、搜索（shadcn Select，基于 Radix）"
    sizes:
      sm: "h-8 px-3 text-sm"
      md: "h-10 px-3 text-sm" # 默认
      lg: "h-12 px-4 text-base"
    trigger_states:
      default: "border border-gray-300 rounded-lg bg-white text-gray-900"
      hover: "border-gray-400"
      focus: "border-primary-500 ring-2 ring-primary-100"
      open: "border-primary-500 ring-2 ring-primary-100"
      error: "border-error-500 ring-2 ring-error-100"
      disabled: "bg-gray-100 border-gray-200 text-gray-400 cursor-not-allowed"
    dropdown:
      container: "bg-white border border-gray-200 rounded-lg shadow-lg mt-1 z-50 max-h-60 overflow-y-auto"
      option_default: "px-3 py-2 text-sm text-gray-700 cursor-pointer"
      option_hover: "bg-gray-50"
      option_selected: "bg-primary-50 text-primary-700 font-medium"
      option_disabled: "text-gray-400 cursor-not-allowed"
      group_label: "px-3 py-1.5 text-xs font-semibold text-gray-500 uppercase tracking-wide"
    variants:
      single: "默认单选，右侧 ChevronDown 图标 size=16 text-gray-400"
      multiple: "多选，选中项以 Tag 形式展示在 trigger 内，可逐个删除"
      searchable: "trigger 内嵌 input，可过滤选项，Search 图标 size=16"
      clearable: "有值时右侧 X 清除按钮（size=14），替换 ChevronDown"
    placeholder: "text-gray-400"
    rules:
      - "下拉列表 z-index 统一 z-50，避免被遮挡"
