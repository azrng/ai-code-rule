.u-tag{position:absolute;top:-11px;left:16px;z-index:5;font-size:11px;line-height:17px;padding:0 6px;border-radius:4px;color:#fff;font-weight:600;pointer-events:none;white-space:nowrap}
.u-added{background:var(--green)}.u-removed{background:var(--red)}.u-modified{background:var(--yel);color:#2f2400}
.u-dot{flex:none;display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 5px;border-radius:11px;color:#fff;font-weight:700;font-size:12px}
.u-sel{box-shadow:0 0 0 6px rgba(62,99,221,.35)!important}

.show-comp .wf-comp,.dt-render .wf-comp{display:block}
.cv-vp:not(.show-fn) .wf-fn{display:none}
.wf-same{font-size:11px;color:var(--faint);margin-top:2px}
.fade .wf.is-leaf:not(.in-chg):not(.mk),.fade .wf.is-c:not(.in-chg):not(.mk)>.wf-cap,.fade .wf:not(.in-chg)>.wf-same{opacity:.35}
/* layout */
.main.main-canvas{padding:0;overflow:hidden;display:flex}
.cv-layout{display:flex;flex:1;min-width:0;min-height:0}
.cv-list{width:290px;flex:none;border-right:1px solid var(--line2);background:#fff;overflow:auto;padding:12px 12px 40px}

.cv-page{display:flex;gap:6px;align-items:center;flex-wrap:wrap;width:100%;text-align:left;border:none;background:none;padding:8px 6px 4px;white-space:normal}
.cv-page:hover{background:none;color:var(--blue)}
.cv-item{display:flex;gap:8px;align-items:flex-start;width:100%;text-align:left;white-space:normal;border:1px solid transparent;background:none;border-radius:8px;padding:6px 8px;margin-bottom:2px}
.cv-item:hover{background:#f5f6f8}

.cv-world{position:absolute;left:0;top:0;transform-origin:0 0;display:flex;flex-wrap:wrap;width:max-content;max-width:3600px;gap:140px;align-items:flex-start;padding:30px}
.cv-world.anim{transition:transform .35s ease}
.cv-group{display:flex;gap:48px;align-items:flex-start}

.cv-tools{position:absolute;top:10px;right:10px;z-index:20;display:flex;gap:4px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:9px;padding:4px;box-shadow:0 2px 8px rgba(0,0,0,.08);cursor:default}
.cv-tools button{padding:2px 9px;border-color:transparent}
.cv-tools button.on{background:var(--ink);color:#fff}
.cv-zoom{min-width:44px;text-align:center;font-size:12px;color:var(--muted)}
.cv-sep{width:1px;height:18px;background:var(--line2);margin:0 2px}
.cv-hint{position:absolute;left:12px;bottom:10px;z-index:20;font-size:11.5px;color:var(--muted);background:rgba(255,255,255,.85);padding:2px 8px;border-radius:6px}

/* detail panel */
.inspector.dt{width:min(560px,44vw)}
.dt-nav{display:inline-flex;gap:4px;margin-left:auto;margin-right:8px}
.dt-nav button{padding:1px 8px;font-size:12px}

.dt-void{border:1px dashed var(--line);border-radius:8px;padding:18px;text-align:center;color:var(--faint);background:repeating-linear-gradient(45deg,#fafafa,#fafafa 8px,#f3f3f3 8px,#f3f3f3 16px)}
.dt-block{border-top:1px solid var(--line2);padding-top:8px}
.dt-list{margin:0;padding-left:18px;font-size:12.5px}.dt-list li{padding:2px 0}

.cv-vp .palette .pal-item,.cv-vp .palette .pal-gt{white-space:nowrap;flex:none}

/* ================= hard prototype theme: square corners, flat surfaces, no shadows, black lines ================= */
:root{--ink:#111;--muted:#555;--faint:#8a8a8a;--line:#b5b5b5;--line2:#d4d4d4;--bg:#f0f0f0;--wf:#fff;--wf-line:#333;--blue:#1f4fd8;--blue-bg:#eaf0ff;--purple:#5b34a6}

.top{border-bottom:1px solid var(--ink)}
.tabs{border-bottom:1px solid var(--ink)}

button{border:1px solid var(--ink);background:#fff;padding:3px 10px}
button:hover:not(:disabled){background:#e8e8e8}

.stage{border:1px solid currentColor}
.card{border:1px solid var(--ink)}
.inspector{border-left:1px solid var(--ink)}
.cv-list{border-right:1px solid var(--ink)}
input,select,textarea{border:1px solid #777}
.banner{border-bottom:1px solid var(--ink)}
.cv-item{border:1px solid transparent}
.cv-item.on{border-color:var(--ink);background:#fff}
.cv-q{border:1px solid var(--ink);background:#fff;color:var(--ink)}
.chip{border:1px solid currentColor;background:#fff}
.u-dot{border:1px solid rgba(0,0,0,.25)}
/* canvas */
.cv-vp{background-color:#ececec;background-image:linear-gradient(#dcdcdc 1px,transparent 1px),linear-gradient(90deg,#dcdcdc 1px,transparent 1px);background-size:24px 24px}
.cv-frame{border:1.5px solid var(--ink)}
.cv-fh{background:#fff;border-bottom:1px solid var(--ink);font-size:14px;font-weight:700}
.cv-fb{padding:16px}
.cv-ov{border:1.5px solid var(--ink);padding:10px}
.cv-ovdrop{border:1.5px dashed #666;background:#fff}

/* wireframes */
.wf{border:1px solid #333;background:#fff;padding:7px 9px}

    patch.ops.length ? '- 把这份反馈原样保存为 .smyw/<dir>/feedback-v' + BASE.version + '.md，运行 node <skill>/scripts/apply-feedback.mjs <这份 md> <spec.json>：它把末尾的 smyw-patch（用户对 v' + BASE.version + ' 的结构修改，已重新标注 added/removed/modified、movedFrom/movedTo）应用到 spec.json，version + 1。不要凭上面的操作描述手工重放。' : '- 用户没有改方案结构：直接在现有 spec 上落实批注，version + 1。',
    '- 「必须改」全部落实；「建议」尽量采纳，不采纳要说明理由；「疑问」先回答再动手。',
    '- 线框只表达结构和交互，不代表视觉样式；样式/风格类意见在实现时按项目现有设计规范落实。', '');
  if (patch.ops.length) L.push('<details><summary>smyw-patch（相对 v' + BASE.version + ' 的结构修改，' + patch.ops.length + ' 条）</summary>', '', FENCE + 'json', JSON.stringify(patch), FENCE, '', '</details>', '');
  if (withSpec) L.push('<details><summary>revisedSpec（备用：修改后的完整方案 JSON）</summary>', '', FENCE + 'json', JSON.stringify(cleanSpec()), FENCE, '', '</details>', '');
  return L.join('\n');
}
async function copyText(s) {
  try { await navigator.clipboard.writeText(s); return true; } catch (e) { /* blocked: fall through */ }
  const ta = h('textarea', { style: 'position:fixed;left:-9999px;top:0' }); ta.value = s; document.body.append(ta); ta.select();
  let ok = false; try { ok = document.execCommand('copy'); } catch (e2) { ok = false; }
  ta.remove(); return ok;
}
async function copyFeedback() {
  const ok = await copyText(buildMarkdown(ui.includeSpec));
  if (ok) { toast('已复制。粘贴到和 Agent 的对话里发送即可。'); return true; }
  if (ui.tab !== 'feedback') ui.tab = 'feedback';
  toast('浏览器不允许自动复制：已选中全部反馈，请按 Ctrl+C / ⌘C 复制。', true);
  // Select after the toast re-render; render() keeps focus on [data-f] fields and focus re-selects.
  const out = document.getElementById('smyw-out');
  if (out) { out.focus(); out.select(); out.scrollIntoView({ block: 'center' }); }
  return false;
}
function download(name, text, type) {
  try { const a = h('a', { href: URL.createObjectURL(new Blob([text], { type: type + ';charset=utf-8' })), download: name }); document.body.append(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000); }
  catch (e) { toast('当前环境不允许下载，请改用「复制反馈」。', true); }
}

// ------------------------------------------------------------------ boot
document.addEventListener('keydown', (e) => {
  const tag = document.activeElement ? document.activeElement.tagName : '';
  const typing = tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT';
  if ((e.ctrlKey || e.metaKey) && (e.key === 'z' || e.key === 'Z') && !typing) { e.preventDefault(); if (e.shiftKey) redo(); else undo(); }
  else if ((e.ctrlKey || e.metaKey) && (e.key === 'y' || e.key === 'Y') && !typing) { e.preventDefault(); redo(); }
  else if (!typing && (e.key === 'Delete' || e.key === 'Backspace') && ui.mode === 'edit' && ui.sel && ui.sel.kind === 'node' && ui.sel.side === 'after') { e.preventDefault(); const s = ui.sel; mutate(() => opDelete(s.page, s.id)); }
  else if (e.key === 'Escape' && ui.play) { if (ui.play.ovs.length) { ui.play.ovs.pop(); render(); } }
  else if (e.key === 'Escape') { ui.sel = null; ui.unit = null; render(); }
  else if (e.key === ' ' && !typing && ui.tab === 'canvas' && !ui.space && !ui.play) { ui.space = true; const v = vpEl(); if (v) v.classList.add('space'); e.preventDefault(); }
});
validateSel();
render();

/* Programmatic handle (used by tests; also handy from the devtools console). */
document.addEventListener('keyup', (e) => { if (e.key === ' ') { ui.space = false; const v = vpEl(); if (v) v.classList.remove('space'); } });
window.addEventListener('resize', () => { if (ui.tab === 'canvas' && ui.cam) applyCam(); });

window.smyw = {
  get state() { return S; }, ui: ui, render: render, undo: undo, redo: redo, setMode: setMode, setTab: setTab,
  setPage: (id) => { ui.page = id; ui.sel = null; render(); },
  play: { start: startPlay, stop: stopPlay, click: (pid, id) => runIA(pid, id), back: () => playBack(), get state() { return ui.play; } },
  get units() { computeUnits(); return UNITS.map((u) => Object.assign({}, u)); },
  focusUnit: focusUnit, focusNode: focusNode, fit: () => fitCam(false), zoomAt: zoomAt,
  op: {
    move: (pid, id, dest) => mutate(() => opMove(pid, id, dest)),
    add: (pid, type, dest) => mutate(() => opAdd(pid, type, dest || {})),
    remove: (pid, id) => mutate(() => opDelete(pid, id)),
    restore: (pid, id) => mutate(() => opRestore(pid, id)),
    convert: (pid, id, kind) => mutate(() => opConvert(pid, id, kind || 'modal')),
    sibling: (pid, id, dir) => mutate(() => opSibling(pid, id, dir)),
    edit: (pid, id, field, val) => editor(() => { const p = pageById(pid); const e = p && findNode(p, id); return e && e.n; }, field, { target: { kind: 'node', page: pid, id: id }, name: ref, prefix: () => pfx(pageById(pid)) })(val),
    stepMove: (fid, id, dir) => mutate(() => opStepMove(fid, id, dir)),
    comment: (target, category, severity, text) => addComment(target, category, severity, text)
  },
  select: (sel) => { ui.sel = sel; render(); },
  exportJSON: exportJSON, buildMarkdown: buildMarkdown, specPatch: specPatch, copyFeedback: copyFeedback, storageOk: STORAGE_OK
};
})();
</script>
